<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Wallet - MTN MoMo - Home Care Hero</title>
<style>
body{font-family:Arial;background:#f8fafc;margin:0}
header{background:#ffcc00;padding:15px;text-align:center;font-weight:bold}
.container{max-width:600px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-top:15px}
.balance{font-size:36px;color:#0a7a42;font-weight:bold}
input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ddd;font-size:16px}
button{background:#0a7a42;color:white;border:none;font-weight:bold;cursor:pointer}
button.momo{background:#ffcc00;color:black}
.trans{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
a{color:#0a7a42;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header>💳 Home Care Hero Wallet - MTN MoMo</header>
<div class="container">
<div class="card" style="text-align:center">
<p>Current Balance</p>
<div class="balance" id="bal">UGX 0</div>
<p id="phone">+256...</p>
</div>

<div class="card">
<h3>Deposit via MTN MoMo</h3>
<input id="depAmount" type="number" placeholder="Amount e.g 50000">
<input id="momoPhone" type="tel" placeholder="MTN Number 077xxxxxxx">
<button class="momo" onclick="deposit()">Deposit with MoMo</button>
<p style="font-size:12px;color:gray">Demo: Uses localStorage. Real API goes in /api/momo.js</p>
</div>

<div class="card">
<h3>Pay Caregiver</h3>
<select id="caregiver">
<option>Grace N. - Nanny - UGX 50k</option>
<option>David K. - Nurse - UGX 80k</option>
</select>
<input id="payAmount" type="number" placeholder="Amount">
<button onclick="pay()">Pay Now</button>
</div>

<div class="card">
<h3>Transaction History</h3>
<div id="history"></div>
</div>

<p style="margin-top:20px;text-align:center"><a href="index.html">← Home</a> | <a href="admin-dashboard.html">Admin</a> | <a href="privacy.html">Privacy</a></p>
</div>

<script>
let balance = parseInt(localStorage.getItem('hch_balance')||'150000');
let history = JSON.parse(localStorage.getItem('hch_history')||'[]');
function save(){localStorage.setItem('hch_balance',balance);localStorage.setItem('hch_history',JSON.stringify(history));render();}
function render(){
  document.getElementById('bal').innerText='UGX '+balance.toLocaleString();
  let h='';
  history.slice().reverse().forEach(t=>{h+=`<div class="trans"><span>${t.type} - ${t.desc}</span><span>${t.amount>0?'+':''}UGX ${t.amount}</span></div>`});
  if(!h) h='<p style="color:gray">No transactions yet</p>';
  document.getElementById('history').innerHTML=h;
}
function deposit(){
  let amt=parseInt(document.getElementById('depAmount').value);
  let phone=document.getElementById('momoPhone').value;
  if(!amt || amt<1000) return alert('Enter amount');
  balance+=amt;
  history.push({type:'Deposit',desc:'MoMo '+phone,amount:amt});
  save(); alert('Deposited UGX '+amt+' via MTN MoMo (Demo)');
}
function pay(){
  let amt=parseInt(document.getElementById('payAmount').value);
  if(!amt) return alert('Enter amount');
  if(amt>balance) return alert('Insufficient balance');
  balance-=amt;
  let cg=document.getElementById('caregiver').value;
  history.push({type:'Payment',desc:cg,amount:-amt});
  // Add booking for admin
  let bookings=JSON.parse(localStorage.getItem('hch_bookings')||'[]');
  bookings.push({client:'You',caregiver:cg,service:'Care',amount:amt,status:'Paid'});
  localStorage.setItem('hch_bookings',JSON.stringify(bookings));
  save(); alert('Paid UGX '+amt+' to '+cg);
}
render();
</script>
</body>
</html>
