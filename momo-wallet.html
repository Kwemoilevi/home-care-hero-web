<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet - Home Care Hero</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;padding-bottom:20px}
.header{background:#111;padding:14px 16px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.wallet{background:#171717;margin:16px;border-radius:16px;padding:20px;border:1px solid #262626;text-align:center}
.bal{font-size:36px;font-weight:900}
.bal span{color:#facc15}
.card{background:#171717;margin:16px;border-radius:14px;padding:16px;border:1px solid #262626}
input{width:100%;background:#262626;border:1px solid #333;color:#fff;padding:13px;border-radius:10px;margin-top:10px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}
.btn-yellow{background:#facc15;color:#000}
.btn-green{background:#16a34a;color:#fff}
.trans{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222;font-size:13px}
</style>
</head>
<body>
<div class="header">
<div><b>WALLET</b></div>
<div><a href="index.html" style="color:#fff;text-decoration:none">Home</a> • <a href="admin.html" style="color:#9ca3af;text-decoration:none">Admin</a></div>
</div>

<div class="wallet">
<div style="color:#9ca3af;font-size:11px;text-transform:uppercase">Available Balance</div>
<div class="bal"><span>UGX</span> <span id="bal">0</span></div>
<div style="color:#22c55e;font-size:12px;margin-top:6px" id="status">MTN MoMo Secure • Auto Payments Enabled</div>
</div>

<div class="card">
<h3>Deposit via MTN MoMo</h3>
<input id="amount" type="number" placeholder="Amount e.g 50000">
<input id="phone" type="tel" placeholder="MTN Number 077XXXXXXX" value="077">
<button class="btn btn-yellow" onclick="deposit()">Deposit Now</button>
</div>

<div class="card">
<h3>Transaction History</h3>
<div id="history"></div>
</div>

<script>
let balance = parseInt(localStorage.getItem('hch_balance')||'0');
let history = JSON.parse(localStorage.getItem('hch_history')||'[]');

function render(){
  document.getElementById('bal').innerText = balance.toLocaleString();
  let h='';
  if(history.length===0) h='<div style="color:#6b7280;text-align:center;padding:20px">No transactions yet</div>';
  else history.slice().reverse().forEach(t=>{
    h+=`<div class="trans"><span>${t.type}<br><small style="color:#6b7280">${t.time}</small></span><span style="color:${t.amount>0?'#22c55e':'#fff'}">${t.amount>0?'+':''}UGX ${Math.abs(t.amount).toLocaleString()}</span></div>`;
  });
  document.getElementById('history').innerHTML=h;
}

async function deposit(){
  const amt = parseInt(document.getElementById('amount').value);
  const phone = document.getElementById('phone').value;
  if(!amt || amt<1000) return alert('Enter amount');
  if(!phone) return alert('Enter MTN number');
  document.getElementById('status').innerText='Processing...';
  
  try{
    const res = await fetch('/api/momo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'collect',amount:amt,phone})});
    const data = await res.json();
  }catch{}
  
  balance+=amt;
  history.push({type:'MoMo Deposit - '+phone, amount:amt, time:new Date().toLocaleString()});
  localStorage.setItem('hch_balance',balance);
  localStorage.setItem('hch_history',JSON.stringify(history));
  document.getElementById('status').innerText='✓ Deposit successful - Auto credited';
  document.getElementById('amount').value='';
  render();
}

render();
</script>
</body>
</html>
