<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay - Merchant 60577134</title>
<style>body{margin:0;font-family:Arial;background:#f5f5f5}.header{background:#000;color:#ffcc00;padding:14px;text-align:center;font-weight:bold}.card{background:#fff;margin:15px;padding:20px;border-radius:15px}select,button{width:100%;padding:14px;border-radius:10px;margin:8px 0}.btn-pay{background:#000;color:#ffcc00;border:none;font-weight:bold;font-size:16px}</style>
</head>
<body>
<div class="header">PAY TO MERCHANT CODE 60577134</div>
<div class="card">
<label>Select Currency (Varies):</label>
<select id="cur" onchange="calc()">
<option value="UGX">🇺🇬 UGX - 10,000 UGX</option>
<option value="USD">🇺🇸 USD - $2.7</option>
<option value="KES">🇰🇪 KES - KSh 350</option>
<option value="TZS">🇹🇿 TZS - TSh 7,000</option>
<option value="RWF">🇷🇼 RWF - RWF 3,500</option>
<option value="GBP">🇬🇧 GBP - £2.1</option>
</select>
<h2>Fee: <span id="amt">10,000 UGX</span></h2>
<p>Nurse: <b id="nurse">Loading...</b></p>
<div style="background:#ffcc00;padding:12px;border-radius:10px;font-weight:bold;text-align:center">MERCHANT: 60577134<br>USSD: *165*3*60577134*10000#</div>
<p style="font-size:11px;color:#666">All currencies convert to 10K UGX for MTN. Client sees local price, you receive 10K UGX REAL.</p>
<button class="btn-pay" onclick="payNow()">PAY NOW IN <span id="curText">UGX</span></button>
<div id="m" style="margin-top:15px;display:none;padding:12px;background:#e8f5e9;border-radius:10px"></div>
<a href="gps.html" style="display:block;text-align:center;margin-top:10px;font-weight:bold;text-decoration:none;background:#e3f2fd;color:#1976d2;padding:12px;border-radius:10px">📍 Track Nurse After Pay</a>
<a href="momo-wallet.html" style="display:block;text-align:center;margin-top:8px;font-weight:bold;color:#00aa55;text-decoration:none">View Wallet →</a>
</div>
<script>
var rates={UGX:10000,USD:2.7,KES:350,TZS:7000,RWF:3500,GBP:2.1};
document.getElementById('nurse').innerText=localStorage.getItem('selectedNurse')||'Caregiver';
var saved=localStorage.getItem('selectedCurrency')||'UGX';
document.getElementById('cur').value=saved;
function calc(){
var c=document.getElementById('cur').value;
localStorage.setItem('selectedCurrency',c);
document.getElementById('amt').innerText=rates[c].toLocaleString()+' '+c+' (~10,000 UGX)';
document.getElementById('curText').innerText=c;
}
calc();
function payNow(){
var c=document.getElementById('cur').value;
document.getElementById('m').style.display='block';
document.getElementById('m').innerHTML='<b>Paying '+rates[c]+' '+c+' = 10,000 UGX</b><br>To Merchant 60577134<br><br>Dialing MTN...';
setTimeout(function(){window.location.href='tel:*165*3*60577134*10000%23';},600);
var b=parseInt(localStorage.getItem('realBookingEarn')||0)+10000;
localStorage.setItem('realBookingEarn',b);
}
</script>
</body>
</html>
