<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Become a Verified Hero</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7] p-6">
<div class="max-w-lg mx-auto bg-white rounded-[2rem] p-6 border shadow-xl">
<h1 class="font-black text-2xl">Become a Verified Hero 💛</h1>
<p class="text-xs text-gray-500 mt-1">Upload LC + ID to get approved in 2 hours. Earn 20k-45k/day</p>

<div class="mt-5 space-y-3">
<input id="name" placeholder="Full Name" class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm">
<input id="phone" placeholder="Phone 07..." class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm">
<select id="service" class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm">
<option>Qualified Nurse</option><option>Babysitting</option><option>House Cleaning</option><option>Elderly Care</option><option>Cooking</option>
</select>
<input id="loc" placeholder="Village / Zone e.g., Kisaasi" class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm">
<input id="exp" placeholder="Years Experience e.g., 2 years" class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm">
<input id="ref1" placeholder="Reference 1: Name + Phone" class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm">
<input id="ref2" placeholder="Reference 2: Name + Phone" class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm">

<div class="bg-yellow-100 p-4 rounded-2xl border-2 border-[#ffcc00]">
<p class="font-black text-xs">Verification Documents (Required)</p>
<label class="block mt-3 text-[11px] font-bold">1. LC1 Letter Photo *Required <input id="lc" type="file" accept="image/*" class="block mt-1 text-xs"></label>
<label class="block mt-3 text-[11px] font-bold">2. National ID (Front) *Required <input id="id1" type="file" accept="image/*" class="block mt-1 text-xs"></label>
<label class="block mt-3 text-[11px] font-bold">3. Certificate / Training (Optional but +pay) <input id="cert" type="file" accept="image/*" class="block mt-1 text-xs"></label>
</div>

<label class="flex gap-2 text-[11px] mt-3"><input id="agree" type="checkbox"> I agree my LC + ID will be verified. Fake docs = ban.</label>

<button onclick="submitApp()" class="w-full bg-black text-white py-4 rounded-xl font-black mt-4">Submit For Verification</button>
<p id="docStatus" class="text-[11px] text-center mt-2 font-bold"></p>
</div>

<div id="msg" class="hidden bg-green-100 p-4 rounded-xl mt-4 text-center text-sm">
<p class="font-black">Application Sent! ✅</p><p class="text-xs mt-1">We will verify LC + ID and call your references in 2 hours.</p>
</div>
</div>

<script>
function getNum(){return atob('MjU2NzcyMTAxODc1');}
function submitApp(){
let name=document.getElementById('name').value.trim();
let phone=document.getElementById('phone').value.trim();
let agree=document.getElementById('agree').checked;
if(!name||!phone){alert('Please enter name and phone');return;}
if(!agree){alert('Please agree to verification');return;}
let hasLC=document.getElementById('lc').files.length>0;
let hasID=document.getElementById('id1').files.length>0;
let hasCert=document.getElementById('cert').files.length>0;
if(!hasLC||!hasID){if(!confirm('You did NOT attach LC or ID photo. You will be marked unverified. Continue?')){return;}}
let app={
name:name,phone:phone,
service:document.getElementById('service').value,
loc:document.getElementById('loc').value,
exp:document.getElementById('exp').value,
ref1:document.getElementById('ref1').value,
ref2:document.getElementById('ref2').value,
hasLC:hasLC,hasID:hasID,hasCert:hasCert,
status:'pending',date:new Date().toLocaleDateString()
};
let apps=JSON.parse(localStorage.getItem('hch_caregiver_apps')||'[]');
apps.push(app);
localStorage.setItem('hch_caregiver_apps',JSON.stringify(apps));
document.getElementById('docStatus').textContent=`LC:${hasLC?'Yes ✅':'No ❌'} | ID:${hasID?'Yes ✅':'No ❌'} | Cert:${hasCert?'Yes ⭐':'No'}`;
document.getElementById('msg').classList.remove('hidden');
let text=`NEW CAREGIVER APPLICATION%0A%0AName: ${name}%0APhone: ${phone}%0AService: ${app.service}%0ALC: ${hasLC?'✅':'❌'} | ID: ${hasID?'✅':'❌'} | Cert: ${hasCert?'⭐':'❌'}%0ALoc: ${app.loc}%0AExp: ${app.exp}%0ARef1: ${app.ref1}%0ARef2: ${app.ref2}`;
let num=getNum();
window.open('https://wa.me/'+num+'?text='+text,'_blank');
}
</script>
</body>
</html>
