<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Care Hero - GLOBAL - BetPawa Payments + Live GPS</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f7fb}.header{background:#0f172a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.header a{color:#fff;text-decoration:none;background:#2563eb;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;margin-left:6px}.hero{background:linear-gradient(135deg,#2563eb,#7c3aed,#22c55e);color:#fff;padding:32px 18px;text-align:center}.hero h1{font-size:26px}.hero p{opacity:.9;font-size:14px;margin:8px 0}.hero button{padding:12px 18px;background:#fff;color:#2563eb;border:none;border-radius:10px;font-weight:800;margin:4px;cursor:pointer}.filters{background:#fff;margin:-18px 14px 10px;padding:12px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{flex:1;min-width:110px;padding:10px;border:2px solid #e2e8f0;border-radius:8px}.grid{padding:0 14px 20px;display:grid;gap:12px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.badge{background:#dcfce7;color:#166534;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}.badge2{background:#e0e7ff;color:#3730a3;padding:3px 8px;border-radius:10px;font-size:11px}.btn{padding:10px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;margin:2px}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:14px;z-index:30}.modalBox{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:18px}.modalBox input,.modalBox select{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:8px;margin:5px 0}</style></head><body>
<div class="header"><b>🌍 Home Care Hero GLOBAL + 💰 BetPawa Pay</b><div><a href="tracker.html" style="background:#22c55e">📍 LIVE GPS</a><a href="payment.html" style="background:#f59e0b">💰 PAY</a><a href="dashboard.html">📊 Dashboard</a></div></div>
<div class="hero"><h1>🌍 Trusted Caregivers Worldwide</h1><p>Book • Pay like BetPawa • Track LIVE GPS — USA, UK, Uganda, Anywhere!</p><div><button onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">👇 View Caregivers</button><button onclick="location.href='tracker.html'" style="background:#22c55e;color:#fff">📍 Live Tracker</button><button onclick="location.href='payment.html'" style="background:#f59e0b;color:#fff">💰 Pay like BetPawa</button></div><p style="margin-top:10px;font-size:12px;opacity:.9">✅ Sarah Uganda • Emily USA • Grace UK | 🔒 MTN MoMo • Airtel • Visa • PayPal</p></div>
<div class="filters"><input id="q" placeholder="Search..." oninput="render()"><select id="countryFilter" onchange="render()"><option value="">🌍 All Countries</option><option>USA</option><option>UK</option><option>Canada</option><option>Uganda</option><option>Kenya</option><option>Nigeria</option><option>UAE</option><option>Other</option></select><select id="serviceFilter" onchange="render()"><option value="">All Services</option><option>Elderly Care</option><option>Child Care</option><option>Nursing</option><option>House Help</option><option>Live-in Care</option></select></div>
<div id="grid" class="grid"></div>
<div id="modal" class="modal" onclick="if(event.target==this)closeModal()"><div class="modalBox"><h3 id="modalTitle">Book</h3><input id="cName" placeholder="Your Name *"><input id="cPhone" placeholder="Phone + code *"><input id="cLocation" placeholder="Your City & Country"><input id="cDate" type="date"><select id="cService"><option>Elderly Care</option><option>Child Care</option><option>Nursing</option><option>House Help</option><option>Live-in Care</option></select><button class="btn" style="width:100%;background:#2563eb;color:#fff;padding:12px;margin-top:8px" onclick="bookNow()">✅ Confirm Booking</button><div style="display:flex;gap:6px;margin-top:8px"><button class="btn" style="flex:1;background:#f59e0b;color:#fff" onclick="location.href='payment.html'">💰 Pay like BetPawa</button><button class="btn" style="flex:1;background:#22c55e;color:#fff" onclick="location.href='tracker.html'">📍 Track LIVE</button></div><button style="width:100%;margin-top:8px;padding:10px;background:#e2e8f0;border:none;border-radius:8px" onclick="closeModal()">Cancel</button><p id="bookOk" style="display:none;background:#dcfce7;color:#166534;padding:10px;border-radius:8px;margin-top:10px;text-align:center;font-weight:700">✅ Booked! Pay & Track now!</p></div></div>
<script>
const API="https://home-care-hero-api.onrender.com";
let caregivers=JSON.parse(localStorage.getItem('caregivers')||'[]');
if(!caregivers.length){caregivers=[{name:'Sample Caregiver - Sarah',service:'Elderly Care',phone:'+256772101875',location:'Kampala',country:'Uganda'},{name:'Emily Johnson',service:'Child Care',phone:'+1 212 555 0100',location:'New York',country:'USA'},{name:'Grace Atim',service:'Nursing',phone:'+44 20 7123 4567',location:'London',country:'UK'}];localStorage.setItem('caregivers',JSON.stringify(caregivers));}
let selectedCaregiver=null;
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const cf=document.getElementById('countryFilter').value;
 const sf=document.getElementById('serviceFilter').value;
 const grid=document.getElementById('grid');
 let filtered=caregivers.filter(c=>{return (c.name+c.service+c.location+c.country).toLowerCase().includes(q)&&(!cf||c.country==cf)&&(!sf||c.service==sf);});
 grid.innerHTML=filtered.map(c=>`
  <div class="card">
   <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><div><b>${c.name}</b> <span class="badge">${c.service}</span> <span class="badge2">🌍 ${c.country}</span><br><small style="color:#64748b">${c.location} • ${c.phone}</small></div><div><span style="color:#22c55e;font-size:11px;font-weight:700">● LIVE GPS</span></div></div>
   <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
    <button class="btn" style="background:#2563eb;color:#fff;flex:1" onclick="openBook('${c.name.replace(/'/g,"")}')">📅 Book</button>
    <button class="btn" style="background:#f59e0b;color:#fff;flex:1" onclick="location.href='payment.html'">💰 Pay</button>
    <button class="btn" style="background:#22c55e;color:#fff;flex:1" onclick="location.href='tracker.html'">📍 Track</button>
    <button class="btn" style="background:#e2e8f0;color:#000" onclick="shareCaregiver('${c.name}')">📤 Share</button>
   </div>
  </div>`).join('')||'<div style="text-align:center;padding:20px;background:#fff;border-radius:12px">No caregivers. <a href="register.html">Register!</a></div>';
 document.getElementById('cDate').valueAsDate=new Date();
}
function openBook(n){selectedCaregiver=n;document.getElementById('modalTitle').innerText='Book '+n;document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
function shareCaregiver(n){let url=location.href;if(navigator.share)navigator.share({title:n,url});else prompt('Share:',url);}
async function bookNow(){
 const data={client:document.getElementById('cName').value,phone:document.getElementById('cPhone').value,caregiver:selectedCaregiver,clientLocation:document.getElementById('cLocation').value,date:document.getElementById('cDate').value,service:document.getElementById('cService').value,status:'Pending',created:new Date().toLocaleString()};
 if(!data.client||!data.phone)return alert('Enter name & phone');
 let bookings=JSON.parse(localStorage.getItem('bookings')||'[]');bookings.unshift(data);localStorage.setItem('bookings',JSON.stringify(bookings));
 try{await fetch(API+'/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}catch{}
 document.getElementById('bookOk').style.display='block';
 setTimeout(()=>{closeModal();document.getElementById('bookOk').style.display='none';if(confirm('✅ Booking done! Pay now like BetPawa?'))location.href='payment.html';},1000);
}
render();
try{fetch(API+'/caregivers').then(r=>r.json()).then(d=>{if(d&&d.length){caregivers=d;localStorage.setItem('caregivers',JSON.stringify(d));render();}})}catch{}
</script></body></html>
