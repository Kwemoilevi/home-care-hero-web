<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Care Hero</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- HEADER -->
<div class="bg-blue-600 text-white p-4">
  <h1 class="text-xl font-bold">Home Care Hero</h1>
  <p class="text-sm opacity-80">Book care, pay with MTN MoMo</p>
</div>

<div class="p-4 max-w-md mx-auto">

  <!-- WALLET CARD -->
  <div class="bg-white rounded-2xl shadow p-5 mb-4">
    <p class="text-gray-500 text-sm">Wallet Balance</p>
    <h2 id="balance" class="text-3xl font-bold text-gray-800">UGX 6,000</h2>
    <p id="statusText" class="text-green-600 text-sm mt-1">Ready to book</p>
  </div>

  <!-- DEPOSIT CARD -->
  <div class="bg-white rounded-2xl shadow p-5">
    <h3 class="font-semibold mb-3">Deposit Funds</h3>
    
    <label class="text-sm text-gray-600">Amount (UGX)</label>
    <input id="amountInput" type="number" placeholder="Enter amount" 
      class="w-full border rounded-xl p-3 mb-3 mt-1 text-lg" value="1000">

    <label class="text-sm text-gray-600">MTN Number</label>
    <input id="phoneInput" type="tel" placeholder="07XXXXXXXX" 
      class="w-full border rounded-xl p-3 mb-4 mt-1 text-lg">

    <label class="text-sm text-gray-600">Payment Method</label>
    <div class="border rounded-xl p-3 mb-4 flex items-center gap-2 bg-yellow-50 border-yellow-400">
      <span class="text-xl">📱</span>
      <span class="font-medium">MTN Mobile Money</span>
      <span class="ml-auto text-xs bg-yellow-400 px-2 py-1 rounded">REAL</span>
    </div>

    <button id="payBtn" onclick="payReal()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-lg">
      Pay with MoMo
    </button>

    <p id="log" class="text-xs text-gray-500 mt-3 text-center"></p>
  </div>

  <!-- INFO -->
  <div class="bg-blue-50 p-3 rounded-xl mt-4 text-xs text-blue-800">
    ✅ Real MTN MoMo: You will get PIN prompt on your phone. Balance only updates after you approve.
  </div>
</div>

<script>
let balance = 6000;
const balanceEl = document.getElementById('balance');
const logEl = document.getElementById('log');
const statusEl = document.getElementById('statusText');

function updateBalanceUI(){
  balanceEl.innerText = `UGX ${balance.toLocaleString()}`;
}

async function payReal(){
  const amount = document.getElementById('amountInput').value;
  const phone = document.getElementById('phoneInput').value;
  const btn = document.getElementById('payBtn');
  
  if(!amount || Number(amount) < 500){ alert('Enter amount min 500'); return; }
  if(!phone || phone.length < 10){ alert('Enter MTN number 07...'); return; }

  const oldText = btn.innerText;
  btn.innerText = 'Sending to MTN...';
  btn.disabled = true;
  logEl.innerText = 'Requesting MTN...';
  statusEl.innerText = 'Contacting MTN...';
  statusEl.className = 'text-orange-600 text-sm mt-1';

  try{
    const res = await fetch('/api/momo',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({amount, phone})
    });
    const data = await res.json();
    
    if(!data.success) throw new Error(data.message);
    
    logEl.innerText = `Sent! ID: ${data.transactionId}`;
    statusEl.innerText = 'Check your phone! Enter MoMo PIN now';
    statusEl.className = 'text-blue-600 font-bold text-sm mt-1';
    alert(data.message);

    // Poll every 4 seconds for confirmation
    let tries = 0;
    const poll = setInterval(async()=>{
      tries++;
      logEl.innerText = `Checking status... ${tries}/15`;
      try{
        const sRes = await fetch(`/api/momo-status?id=${data.transactionId}`);
        const sData = await sRes.json();
        console.log('MoMo Status:', sData);
        
        if(sData.status === 'SUCCESSFUL'){
          clearInterval(poll);
          balance += Number(amount);
          updateBalanceUI();
          statusEl.innerText = 'Deposit successful - Ready to book';
          statusEl.className = 'text-green-600 text-sm mt-1';
          logEl.innerText = `✅ Confirmed! UGX ${amount} added`;
          alert(`✅ SUCCESS! UGX ${amount} added.\nNew balance: UGX ${balance}`);
        } else if(sData.status === 'FAILED'){
          clearInterval(poll);
          statusEl.innerText = 'Payment failed / Rejected';
          statusEl.className = 'text-red-600 text-sm mt-1';
          logEl.innerText = `❌ Failed: ${sData.reason || 'Rejected'}`;
          alert('❌ Payment failed or you rejected it');
        }
      }catch(e){ console.log(e); }
      
      if(tries >= 15){
        clearInterval(poll);
        logEl.innerText = 'Timeout - Check MoMo transactions';
        statusEl.innerText = 'Check your MTN MoMo message';
      }
    },4000);

  }catch(e){
    alert('Error: '+e.message);
    logEl.innerText = 'Error: '+e.message;
    statusEl.innerText = 'Failed';
    statusEl.className = 'text-red-600 text-sm mt-1';
  }finally{
    btn.innerText = oldText;
    btn.disabled = false;
  }
}

updateBalanceUI();
</script>
</body>
</html>
