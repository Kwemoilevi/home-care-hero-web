<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalCare - Home Care Hero</title>
<style>body{font-family:Arial;margin:0;background:#f5f7fb}.banner{background:linear-gradient(90deg,#0a7a07,#12d10e);color:white;padding:15px;text-align:center}.hero{padding:40px 20px;text-align:center}.btn{background:#0a7a07;color:white;padding:15px 30px;border:none;border-radius:10px;font-size:18px;cursor:pointer}.stats{max-width:600px;margin:20px auto;background:white;padding:15px;border-radius:10px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}</style>
</head>
<body>
<div class="banner">💊 AD: City Pharmacy - Paracetamol 5,000 UGX - Call 075xxxxxxx | Views count = REAL MONEY</div>
<div class="hero">
<h1>GlobalCare Home Care Hero</h1>
<p>Trusted Home Nursing in Kampala</p>
<button class="btn" id="shopBtn">Shop Now - Pharmacy</button>
<div class="stats">
<h3>REAL Earnings Today</h3>
<p>Views: <span id="v">Loading...</span> | Clicks: <span id="c">Loading...</span></p>
<h2 style="color:#0a7a07">UGX <span id="t">0</span></h2>
<p style="font-size:12px;color:gray">This is REAL from Firebase - Not demo</p>
</div>
</div>

<script type="module">
import { trackView, trackClick, getRevenue } from "./firebase.js";
await trackView("index","city-pharma");

const shopBtn=document.getElementById('shopBtn');
shopBtn.onclick=async()=>{
  await trackClick("shop_now_click","city-pharma","pharmacy_page");
  location.href="pharmacy.html";
};

async function loadRevenue(){
  try{
    const r=await getRevenue();
    document.getElementById('v').textContent=r.views;
    document.getElementById('c').textContent=r.clicks;
    document.getElementById('t').textContent=r.total.toLocaleString();
  }catch(e){ document.getElementById('v').textContent="Set Firebase Keys!"; }
}
loadRevenue();
setInterval(loadRevenue,3000);
</script>
</body>
</html>
