<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalCare - Home Care Hero</title>
<style>body{font-family:Arial;margin:0;background:#f5f7fb}.banner{background:#0a7a07;color:white;padding:10px;text-align:center;font-size:13px}.hero{padding:30px 20px;text-align:center}.btn{background:#0a7a07;color:white;padding:12px 25px;border:none;border-radius:8px;cursor:pointer;margin:5px}.card{max-width:500px;margin:20px auto;background:white;padding:20px;border-radius:10px}input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:6px}</style>
</head>
<body>
<div class="banner">💊 AD: City Pharmacy - Paracetamol 5,000 UGX | REAL Views = REAL UGX</div>
<div class="hero">
<h1>GlobalCare Home Care Hero</h1>
<div id="authBox" class="card">
<h3>Login / Sign Up</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" id="loginBtn">Login</button>
<button class="btn" id="signupBtn">Sign Up</button>
<p id="authMsg"></p>
</div>

<div id="mainBox" class="card" style="display:none">
<p>Welcome <span id="userEmail"></span></p>
<button class="btn" onclick="location.href='pharmacy.html'">Shop Pharmacy</button>
<button class="btn" onclick="location.href='admin.html'">Admin Dashboard</button>
<button class="btn" style="background:gray" id="logoutBtn">Logout</button>
<div style="margin-top:15px;border-top:1px solid #eee;padding-top:10px">
<b>REAL Earnings:</b> Views <span id="v">0</span> | Clicks <span id="c">0</span> | <span style="color:green;font-weight:bold">UGX <span id="t">0</span></span>
</div>
</div>
</div>

<script type="module">
import { auth, trackView, getRevenue, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "./firebase.js";
await trackView("index","city-pharma");

const authBox=document.getElementById('authBox'), mainBox=document.getElementById('mainBox');
onAuthStateChanged(auth, (user)=>{
  if(user){ authBox.style.display='none'; mainBox.style.display='block'; document.getElementById('userEmail').textContent=user.email; loadRev(); }
  else{ authBox.style.display='block'; mainBox.style.display='none'; }
});

document.getElementById('loginBtn').onclick=async()=>{
  try{ await signInWithEmailAndPassword(auth, email.value, password.value); }catch(e){ authMsg.textContent=e.message; }
};
document.getElementById('signupBtn').onclick=async()=>{
  try{ await createUserWithEmailAndPassword(auth, email.value, password.value); }catch(e){ authMsg.textContent=e.message; }
};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);

async function loadRev(){
  try{
    const r=await getRevenue();
    document.getElementById('v').textContent=r.views;
    document.getElementById('c').textContent=r.clicks;
    document.getElementById('t').textContent=r.total.toLocaleString();
  }catch(e){ console.log("Need Firebase keys + Firestore Rules"); }
}
</script>
</body>
</html>
