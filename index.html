<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Care Hero - Nursing at Home | Worldwide</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f6f8fb;color:#111}
header{background:#0b5ed7;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}
header b{font-size:19px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}nav button{background:#fff;color:#0b5ed7;border:0;padding:8px 10px;border-radius:20px;font-weight:700;cursor:pointer}
nav button.active{background:#ffc107;color:#111}
.container{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font-size:15px}
.btn{background:#0b5ed7;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;font-weight:800;cursor:pointer;font-size:15px;margin-top:6px}
.btn-yellow{background:#ffc107;color:#111}.btn-green{background:#198754}.btn-outline{background:#fff;color:#0b5ed7;border:2px solid #0b5ed7}
.badge{background:#e7f1ff;color:#0b5ed7;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
.stat{font-size:26px;font-weight:900}.small{font-size:13px;color:#666}
.hidden{display:none}.row{display:flex;gap:10px}.row>*{flex:1}
.item{border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px}
.timeline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.step{padding:6px 10px;border-radius:20px;background:#eee;font-size:12px;font-weight:700}.step.on{background:#198754;color:#fff}.step.now{background:#ffc107;color:#111}
</style>
<script>
function showPage(page){
  var pages=['home','book','track','wallet','login','admin'];
  for(var i=0;i<pages.length;i++){
    var p=pages[i];
    var el=document.getElementById('page-'+p);
    if(el){ if(p===page) el.classList.remove('hidden'); else el.classList.add('hidden'); }
    var b=document.getElementById('b-'+p);
    if(b){ if(p===page) b.classList.add('active'); else b.classList.remove('active'); }
  }
  if(page==='wallet' && window.loadWallet) loadWallet();
  if(page==='track' && window.loadTracking) loadTracking();
  if(page==='admin' && window.loadAdmin) loadAdmin();
}
</script>
</head>
<body>
<header><b>🌍 Home Care Hero - Worldwide</b><div class="small" style="color:#dbeafe">Available Worldwide • Nursing at Home in Any Country</div><nav>
<button onclick="showPage('home')" id="b-home" class="active">Home</button>
<button onclick="showPage('book')" id="b-book">Book Nurse</button>
