<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Care Hero - Worldwide</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7]">
<nav class="bg-black text-white px-6 py-4 flex justify-between sticky top-0">
<div class="font-black">Home Care Hero 💛 Global</div>
<a href="caregiver-register.html" class="text-[10px] bg-[#ffcc00] text-black px-3 py-1 rounded-full font-bold">Join as Caregiver</a>
</nav>
<div class="max-w-xl mx-auto p-6">
<div class="bg-white rounded-[2rem] p-7 border shadow-xl">
<h1 class="font-black text-3xl">Verified Care in <span class="bg-[#ffcc00] px-2 rounded-xl">Worldwide</span></h1>
<p class="text-xs text-gray-500 mt-2">Auto-currency by location. ID Verified.</p>
<div class="mt-6 space-y-3">
<input id="cName" placeholder="Your Name" class="w-full px-4 py-3 rounded-xl border">
<input id="cPhone" placeholder="Phone / WhatsApp" class="w-full px-4 py-3 rounded-xl border">
<input id="cLoc" oninput="updateCurrency()" placeholder="Location e.g., London, New York, Nairobi, Dubai" class="w-full px-4 py-3 rounded-xl border">
<p id="currencyNote" class="text-[11px] font-bold text-green-600">🌍 Type location to see your local price</p>
<select id="cService" class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm font-bold"></select>
<textarea id="cNote" placeholder="Details..." class="w-full px-4 py-3 rounded-xl border h-20"></textarea>
<button onclick="bookNow()" class="w-full bg-black text-white py-4 rounded-xl font-black">Book Now - Pay Deposit ✅</button>
</div>
</div>
<div class="bg-[#ffcc00] p-4 rounded-2xl border-2 border-black mt-6">
<p class="font-black text-sm">🛡️ Pay Deposit - <span id="depositText">20 USD to confirm</span></p>
<p class="text-xs mt-1">Balance on arrival. Verified caregivers worldwide.</p>
</div>
</div>
<script>
const rates = {
london:{symbol:'£',currency:'GBP',prices:[12,28,16,24,12],deposit:'£15'},
newyork:{symbol:'$',currency:'USD',prices:[15,35,20,30,15],deposit:'$20'},
nairobi:{symbol:'KSh ',currency:'KES',prices:[2000,5000,3000,4500,2000],deposit:'KSh 3000'},
dubai:{symbol:'AED ',currency:'AED',prices:[55,130,75,110,55],deposit:'AED 75'},
kampala:{symbol:'UGX ',currency:'UGX',prices:[35000,70000,40000,60000,35000],deposit:'UGX 50k'},
lagos:{symbol:'₦',currency:'NGN',prices:[10000,25000,15000,20000,10000],deposit:'₦15k'},
default:{symbol:'$',currency:'USD',prices:[15,35,20,30,15],deposit:'$20'}
};
const services = ["Babysitting","Qualified Nurse","House Cleaning","Elderly Care","Cooking"];
function getRate(){
const loc = document.getElementById('cLoc').value.toLowerCase();
if(loc.includes('london')||loc.includes('uk')||loc.includes('england')) return rates.london;
if(loc.includes('new york')||loc.includes('usa')||loc.includes('us')||loc.includes('america')) return rates.newyork;
if(loc.includes('nairobi')||loc.includes('kenya')) return rates.nairobi;
if(loc.includes('dubai')||loc.includes('uae')) return rates.dubai;
if(loc.includes('lagos')||loc.includes('nigeria')) return rates.lagos;
if(loc.includes('kampala')||loc.includes('uganda')) return rates.kampala;
return rates.default;
}
function updateCurrency(){
const r = getRate();
const sel = document.getElementById('cService');
sel.innerHTML = "";
services.forEach((s,i)=>{
const opt = document.createElement('option');
opt.value = s;
opt.textContent = s + " - " + r.symbol + r.prices[i] + "/day";
sel.appendChild(opt);
});
document.getElementById('depositText').textContent = r.deposit + ' to confirm';
document.getElementById('currencyNote').textContent = "🌍 Detected: " + r.currency + " (" + r.symbol.trim() + ") - Prices updated!";
}
function bookNow(){
const name=document.getElementById('cName').value;
const phone=document.getElementById('cPhone').value;
const loc=document.getElementById('cLoc').value;
if(!name||!phone||!loc){alert('Fill Name, Phone, Location');return;}
const r=getRate();
alert("✅ Booking " + name + " in " + loc + " - Price in " + r.currency + " - We will call you!");
}
updateCurrency();
</script>
</body>
</html>
