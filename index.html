<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Care Hero - Book Verified Help Worldwide</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7]">
<nav class="bg-black text-white px-6 py-4 flex justify-between sticky top-0 z-50">
<div class="font-black">Home Care Hero 💛 Global</div>
<a href="caregiver-register.html" class="text-[10px] bg-[#ffcc00] text-black px-3 py-1 rounded-full font-bold">Join as Caregiver</a>
</nav>
<div class="max-w-xl mx-auto p-6">
<div class="bg-white rounded-[2rem] p-7 border shadow-xl">
<h1 class="font-black text-3xl">Verified Care in <span class="bg-[#ffcc00] px-2 rounded-xl">Worldwide</span></h1>
<p class="text-xs text-gray-500 mt-2">Babysitters & Nurses - ID Verified Worldwide. Pay deposit to confirm.</p>

<div class="mt-6 space-y-3">
<input id="cName" placeholder="Your Name" class="w-full px-4 py-3 rounded-xl border">
<input id="cPhone" placeholder="Your Phone / WhatsApp" class="w-full px-4 py-3 rounded-xl border">
<input id="cLoc" placeholder="Location e.g., London, New York, Nairobi, Dubai" class="w-full px-4 py-3 rounded-xl border">
<select id="cService" class="w-full px-4 py-3 rounded-xl border bg-gray-50 text-sm">
<option value="Babysitting">Babysitting - $15/day</option>
<option value="Qualified Nurse">Qualified Nurse - $35/day</option>
<option value="House Cleaning">House Cleaning - $20/day</option>
<option value="Elderly Care">Elderly Care - $30/day</option>
<option value="Cooking">Cooking - $15/day</option>
</select>
<textarea id="cNote" placeholder="Details: kids age, hours, special needs..." class="w-full px-4 py-3 rounded-xl border h-20"></textarea>
<button onclick="bookNow()" class="w-full bg-black text-white py-4 rounded-xl font-black">Book Now - Pay Deposit ✅</button>
</div>
</div>

<div class="bg-[#ffcc00] p-4 rounded-2xl border-2 border-black mt-6">
<p class="font-black text-sm">🛡️ Pay Deposit - Secure Pay</p>
<p class="text-xs mt-1">20 USD to confirm. Balance on arrival. Verified caregivers worldwide.</p>
<button onclick="bookNow()" class="mt-3 bg-black text-white px-6 py-2 rounded-xl text-sm font-bold">Pay Securely</button>
</div>

<div class="text-center mt-6 text-[10px] text-gray-400">
<p>🌍 Serving 150+ Cities Worldwide • Trusted & Verified</p>
</div>

</div>

<script>
function bookNow(){
 const name=document.getElementById('cName').value;
 const phone=document.getElementById('cPhone').value;
 const loc=document.getElementById('cLoc').value;
 const service=document.getElementById('cService').value;
 if(!name || !phone || !loc){alert('Please fill Name, Phone, Location');return;}
 alert('✅ Booking Received! '+name+' in '+loc+' for '+service+' - We will call you shortly!');
 // Add Firebase code here if you have it
}
</script>
</body>
</html>
