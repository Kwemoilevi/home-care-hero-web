<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Care Hero</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,Arial;background:#f6f7fb;color:#111}
header{background:#111827;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:18px} #status{font-size:12px;background:#f59e0b;color:#111;padding:6px 10px;border-radius:999px;font-weight:700}
#status.live{background:#22c55e;color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h2{margin:0 0 10px} label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:800;cursor:pointer;width:100%}
.btn-dark{background:#111827;color:#fff} .btn-green{background:#16a34a;color:#fff} .btn-outline{background:#fff;border:1px solid #ddd;color:#111}
.tabs{display:flex;gap:8px;margin-bottom:14px} .tabs button{flex:1;background:#e5e7eb;color:#111} .tabs button.active{background:#111827;color:#fff}
.job{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:12px}
.job b{font-size:16px} .muted{color:#666;font-size:13px} .pill{display:inline-block;background:#dcfce7;color:#166534;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.hidden{display:none}
</style>
</head>
<body>
<header><b>🏠 Home Care Hero</b><span id="status">🟡 DEMO - Not Connected</span></header>
<div class="wrap">
<div class="tabs">
<button id="tabClient" class="active" onclick="showTab('client')">I Need Care</button>
<button id="tabCarer" onclick="showTab('carer')">I Am a Carer</button>
</div>

<!-- CLIENT -->
<div id="clientView" class="card">
<h2>Post a Care Job</h2>
<label>Your Name</label><input id="cName" placeholder="e.g. Sarah">
<div class="row"><div><label>Location / Area</label><input id="cArea" placeholder="e.g. Kampala - Ntinda"></div><div><label>Phone / WhatsApp</label><input id="cPhone" placeholder="e.g. 0770..."></div></div>
<label>What help do you need?</label>
<select id="cType"><option>Elderly Care</option><option>Child Care / Nanny</option><option>Postnatal Care</option><option>Companion / House Help</option><option>Nurse / Medical Care</option><option>Cleaning & Cooking</option></select>
<div class="row"><div><label>Date Needed</label><input id="cDate" type="date"></div><div><label>Pay (UGX per day)</label><input id="cPay" type="number" placeholder="e.g. 30000"></div></div>
<label>Details</label><textarea id="cDetails" rows="3" placeholder="Hours, duties, special needs..."></textarea>
<button class="btn-dark" style="margin-top:14px" onclick="postJob()">Post Job - Go Live ✅</button>
<p class="muted" id="postMsg"></p>
<h2 style="margin-top:20px">My Posted Jobs</h2>
<div id="myJobs"></div>
</div>

<!-- CARER -->
<div id="carerView" class="card hidden">
<h2>Available Jobs - Live</h2>
<p class="muted">Jobs appear here instantly when a client posts. No refresh needed.</p>
<label>Filter by Area</label><input id="filterArea" placeholder="Type area to filter..." oninput="renderJobs()">
<div id="allJobs"></div>
</div>

<div class="card">
<h2>How it works</h2>
<p class="muted">1. Client posts a job → 2. It saves to Firebase → 3. Carer sees it instantly → 4. Carer calls / WhatsApps client.</p>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
// --- PASTE YOUR FIREBASE CONFIG HERE ---
// Paste your block that starts with: var firebaseConfig = { ... };
// Example (DO NOT USE THIS, use YOURS):
// var firebaseConfig = { apiKey: "YOURS", authDomain: "...", databaseURL: "...", projectId: "...", ... };

var db = null;
try{
  if(typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("PASTE")){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    document.getElementById('status').textContent = "🟢 REAL LIVE - Connected to Firebase ✅";
    document.getElementById('status').className = "live";
  }
}catch(e){ console.log(e); }

var jobs = [];
var currentTab = 'client';

function showTab(t){
  currentTab = t;
  document.getElementById('clientView').classList.toggle('hidden', t!=='client');
  document.getElementById('carerView').classList.toggle('hidden', t!=='carer');
  document.getElementById('tabClient').classList.toggle('active', t==='client');
  document.getElementById('tabCarer').classList.toggle('active', t==='carer');
}

function postJob(){
  var name = document.getElementById('cName').value.trim();
  var area = document.getElementById('cArea').value.trim();
  var phone = document.getElementById('cPhone').value.trim();
  var type = document.getElementById('cType').value;
  var date = document.getElementById('cDate').value;
  var pay = document.getElementById('cPay').value;
  var details = document.getElementById('cDetails').value.trim();
  if(!name || !area || !phone){ document.getElementById('postMsg').textContent = "Please fill Name, Area and Phone."; return; }
  var job = { name:name, area:area, phone:phone, type:type, date:date, pay:pay, details:details, createdAt: Date.now(), status:"Open" };
  if(db){
    db.ref('jobs').push(job).then(function(){
      document.getElementById('postMsg').textContent = "✅ Job posted LIVE! Carers can see it now.";
    });
  } else {
    job.id = 'demo'+Date.now(); jobs.unshift(job); renderJobs();
    document.getElementById('postMsg').textContent = "⚠️ Demo mode - connect Firebase to go live. Job saved locally only.";
  }
  document.getElementById('cDetails').value = "";
}

function renderJobs(){
  var filter = (document.getElementById('filterArea').value||"").toLowerCase();
  var filtered = jobs.filter(function(j){ return !filter || (j.area||"").toLowerCase().includes(filter); });
  var html = "";
  if(filtered.length===0) html = "<p class='muted'>No jobs yet. Post one to test.</p>";
  filtered.forEach(function(j){
    html += "<div class='job'><div style='display:flex;justify-content:space-between'><b>"+escapeHtml(j.type)+"</b><span class='pill'>"+escapeHtml(j.status||"Open")+"</span></div>"
    + "<p class='muted'>📍 "+escapeHtml(j.area)+" • 📅 "+escapeHtml(j.date||"ASAP")+" • 💰 UGX "+escapeHtml(j.pay||"Negotiable")+"</p>"
    + "<p>"+escapeHtml(j.details||"")+"</p>"
    + "<p><b>"+escapeHtml(j.name)+"</b> • <a href='tel:"+escapeHtml(j.phone)+"'>📞 "+escapeHtml(j.phone)+"</a> • <a target='_blank' href='https://wa.me/256"+escapeHtml(j.phone).replace(/\D/g,'').slice(-9)+"'>WhatsApp</a></p></div>";
  });
  document.getElementById('allJobs').innerHTML = html;
  document.getElementById('myJobs').innerHTML = html;
}

function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

if(db){
  db.ref('jobs').orderByChild('createdAt').on('value', function(snap){
    jobs = [];
    snap.forEach(function(child){ var v=child.val(); v.id=child.key; jobs.unshift(v); });
    renderJobs();
  });
}
renderJobs();
</script>
</body>
</html>
