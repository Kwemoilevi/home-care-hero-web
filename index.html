<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Care Hero - REAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f0f7f4;color:#222}
.topbar{background:#fff3cd;text-align:center;padding:10px;font-size:13px;font-weight:bold}
header{background:#0a7a5a;color:#fff;text-align:center;padding:20px 12px}
header h1{font-size:28px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0}
.pills span{background:rgba(0,0,0,.25);padding:5px 10px;border-radius:20px;font-size:12px}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0}
.btns button{border:none;padding:9px 14px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:13px;background:#fff}
.btns .black{background:#111;color:#fff}
.btns .orange{background:#ff8c00;color:#fff}
.section{padding:15px;max-width:900px;margin:auto}
.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:15px}
.card h3{color:#0a7a5a;margin-bottom:8px;text-align:center}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
.wallet-btn{width:100%;padding:13px;border:none;border-radius:8px;font-weight:bold;margin:6px 0;font-size:15px;cursor:pointer}
.green{background:#0a7a5a;color:#fff}.orange{background:#ff8c00;color:#fff}.red{background:#dc3545;color:#fff}.yellow{background:#ffcc00}
.wallet-box{background:#0a7a5a;color:#fff;text-align:center;padding:15px;border-radius:10px;margin:10px 0}
.wallet-box h2{font-size:32px}
.tx{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between}
.badge{background:#d4edda;color:#155724;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.verified-card{border:2px solid #0a7a5a;border-radius:10px;padding:12px;margin-top:10px}
.pending-card{border:2px solid orange;border-radius:10px;padding:12px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:15px}
.modal.active{display:flex}
.modal-box{background:#fff;width:100%;max-width:450px;border-radius:15px;padding:20px;max-height:90vh;overflow:auto}
.hidden{display:none}
img.id-photo{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px}
</style>
</head>
<body>

<div class="topbar">👀 <span id="realVisitors">...</span> Live Real Visitors | 📅 <span id="realBookings">0</span> Real Bookings | 🌍 Real Database - Firebase</div>

<div style="background:#fff;text-align:center;padding:10px">
<label style="font-weight:bold">🌍 Country / Currency: </label>
<select id="countrySelect" onchange="changeCountry()" style="width:auto;display:inline-block;padding:8px;border-radius:20px;font-weight:bold">
<option value="UG">🇺🇬 Uganda - UGX</option>
<option value="KE">🇰🇪 Kenya - KES</option>
<option value="TZ">🇹🇿 Tanzania - TZS</option
