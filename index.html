<body>

<script>
var nurses=[
{name:"Auma Grace - Enrolled Nurse",skill:"Home Nursing, Injections",loc:"Kampala - Ntinda",img:"https://i.pravatar.cc/100?img=5"},
{name:"Mukasa John - Caregiver",skill:"Elderly Care, Bathing",loc:"Kampala - Bweyogerere",img:"https://i.pravatar.cc/100?img=12"},
{name:"Nakato Sarah - Midwife",skill:"Postnatal, Newborn Care",loc:"Wakiso - Kira",img:"https://i.pravatar.cc/100?img=32"},
{name:"Okello Levi - General Nurse",skill:"Wound Care, Home Care",loc:"Kampala - Central",img:"https://i.pravatar.cc/100?img=15"}
];

function render(arr){
var html="";
for(var i=0;i<arr.length;i++){
var n=arr[i];
html+='<div class="card"><img src="'+n.img+'"><div style="flex:1"><b>'+n.name+'</b><p style="font-size:12px;color:#666;margin:3px 0">⭐ '+n.skill+'</p><p style="font-size:12px;color:#666">📍 '+n.loc+'</p><div style="margin-top:8px"><button class="btn btn-book" onclick="bookNurse(\''+n.name+'\')">Book 10K</button><button class="btn btn-call" onclick="goPay()">Call</button></div></div></div>';
}
document.getElementById('list').innerHTML=html;
}

function doFilter(){
var q=document.getElementById('q').value.toLowerCase();
var f=[];
for(var i=0;i<nurses.length;i++){
var n=nurses[i];
if(n.name.toLowerCase().indexOf(q)>-1 || n.loc.toLowerCase().indexOf(q)>-1 || n.skill.toLowerCase().indexOf(q)>-1){f.push(n)}
}
render(f.length?f:nurses);
var t=parseInt(localStorage.getItem('adTaps')||0)+1;
localStorage.setItem('adTaps',t);
}

function bookNurse(name){
localStorage.setItem('selectedNurse',name);
window.location.href='pay.html';
}
function goPay(){window.location.href='pay.html';}

// Count view to merchant wallet 60577134
var v=parseInt(localStorage.getItem('adViews')||0)+1;
localStorage.setItem('adViews',v);
var b=parseInt(localStorage.getItem('realBookingEarn')||0);
var tot=b+v*5;
var nav=document.getElementById('navBal');
if(nav) nav.innerHTML=tot.toLocaleString()+' UGX';

render(nurses);
</script>
