<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live GPS Tracker</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff}.header{padding:12px 16px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer}#map{height:70vh;width:100%}.info{background:#fff;color:#000;margin:10px;border-radius:12px;padding:12px}.dot{width:12px;height:12px;background:#22c55e;border-radius:50%;display:inline-block}</style></head><body><div class="header"><b>📍 LIVE GPS</b><div><a href="index.html" style="color:#fff;background:#2563eb;padding:8px 10px;border-radius:8px;text-decoration:none">🏠 Home</a> <a href="dashboard.html" style="color:#fff;background:#334155;padding:8px 10px;border-radius:8px;text-decoration:none">📊 Dash</a></div></div><div class="info"><span class="dot"></span> <b id="status">Live ON</b> | <b id="cg">Sarah</b> | <span id="coords">Getting GPS...</span><br><small>Last: <span id="time">now</span></small></div><div id="map"></div><div style="padding:10px;display:flex;gap:8px"><button class="btn" style="background:#22c55e;color:#fff;flex:1" onclick="startTrack()">▶️ Start</button><button class="btn" style="background:#ef4444;color:#fff;flex:1" onclick="stopTrack()">⏹️ Stop</button><button class="btn" style="background:#2563eb;color:#fff;flex:1" onclick="shareLocation()">📤 Share</button></div><script>let map=L.map('map').setView([0.3476,32.5825],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let marker=L.marker([0.3476,32.5825]).addTo(map).bindPopup('Live').openPopup();let watch=null;function upd(p){let lat=p.coords.latitude,lng=p.coords.longitude;marker.setLatLng([lat,lng]);map.setView([lat,lng],15);document.getElementById('coords').textContent=lat.toFixed(5)+','+lng.toFixed(5);document.getElementById('time').textContent=new Date().toLocaleTimeString();localStorage.setItem('lastLocation',JSON.stringify({lat,lng}));}function startTrack(){if(navigator.geolocation){watch=navigator.geolocation.watchPosition(upd,e=>alert(e.message),{enableHighAccuracy:true});document.getElementById('status').textContent='🔴 LIVE Active';}else alert('GPS no');}function stopTrack(){if(watch)navigator.geolocation.clearWatch(watch);document.getElementById('status').textContent='⏸️ Paused';}function shareLocation(){let l=JSON.parse(localStorage.getItem('lastLocation')||'{"lat":0.3476,"lng":32.5825}');let url='https://www.google.com/maps?q='+l.lat+','+l.lng;if(navigator.share)navigator.share({title:'Live',url});else prompt('Share:',url);}let c=JSON.parse(localStorage.getItem('caregivers')||'[]');if(c[0])document.getElementById('cg').textContent=c[0].name+' - '+c[0].country;startTrack();</script></body></html>
