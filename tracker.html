<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live GPS + WhatsApp</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff}.h{padding:12px;background:#1e293b;display:flex;justify-content:space-between}.btn{padding:12px 14px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:14px}#map{height:65vh;width:100%}.info{background:#fff;color:#000;margin:10px;border-radius:12px;padding:12px}.wa{background:#25D366!important}</style></head><body><div class="h"><b>📍 LIVE GPS</b><div><a href="index.html" style="color:#fff;background:#2563eb;padding:7px 10px;border-radius:8px;text-decoration:none">🏠</a> <a href="dashboard.html" style="color:#fff;background:#334155;padding:7px 10px;border-radius:8px;text-decoration:none">📊</a></div></div><div class="info"><b id="status">🔴 LIVE</b> | <b id="cg">Caregiver</b> | <span id="coords">Locating...</span><br><small id="time">now</small> | <small>Suam Border Live</small></div><div id="map"></div><div style="padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" style="background:#22c55e;color:#fff" onclick="startTrack()">▶️ Start</button><button class="btn" style="background:#ef4444;color:#fff" onclick="stopTrack()">⏹️ Stop</button><button class="btn wa" style="color:#fff;grid-column:span 2" onclick="shareWhatsApp()">💬 Share to WhatsApp Client</button><button class="btn" style="background:#2563eb;color:#fff;grid-column:span 2" onclick="shareLocation()">🔗 Copy Map Link</button></div><script>let map=L.map('map').setView([1.21874,34.73419],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let mk=L.marker([1.21874,34.73419]).addTo(map).bindPopup('Live').openPopup();let watch=null;function upd(p){let lat=p.coords.latitude,lng=p.coords.longitude;mk.setLatLng([lat,lng]);map.setView([lat,lng],15);document.getElementById('coords').textContent=lat.toFixed(5)+','+lng.toFixed(5);document.getElementById('time').textContent=new Date().toLocaleTimeString();localStorage.setItem('lastLocation',JSON.stringify({lat,lng,acc:p.coords.accuracy}));}function startTrack(){if(navigator.geolocation){watch=navigator.geolocation.watchPosition(upd,e=>alert(e.message),{enableHighAccuracy:true});document.getElementById('status').textContent='🔴 ACTIVE';}else alert('No GPS');}function stopTrack(){if(watch)navigator.geolocation.clearWatch(watch);document.getElementById('status').textContent='⏸️ Paused';}function shareLocation(){let l=JSON.parse(localStorage.getItem('lastLocation')||'{"lat":1.21874,"lng":34.73419}');let url='https://www.google.com/maps?q='+l.lat+','+l.lng;navigator.clipboard.writeText(url).then(()=>alert('✅ Link Copied:\n'+url));}function shareWhatsApp(){let l=JSON.parse(localStorage.getItem('lastLocation')||'{"lat":1.21874,"lng":34.73419}');let cg=document.getElementById('cg').textContent||'kwemoi levi';let coords=document.getElementById('coords').textContent;let time=document.getElementById('time').textContent;let mapsUrl='https://www.google.com/maps?q='+l.lat+','+l.lng;let msg=`🔴 *HOME CARE HERO - LIVE GPS*%0A%0A👤 Caregiver: *${cg}*%0A📍 Location: ${coords}%0A🕒 Time: ${time}%0A%0A🗺️ *Live Map:* ${mapsUrl}%0A%0A✅ Tracking from Suam Lower, Uganda-Kenya Border%0A💚 Your loved one is being cared for`;let waUrl='https://wa.me/?text='+msg;window.open(waUrl,'_blank');}let c=JSON.parse(localStorage.getItem('caregivers')||'[]');if(c[0])document.getElementById('cg').textContent=c[0].name||'kwemoi levi';startTrack();</script></body></html>
