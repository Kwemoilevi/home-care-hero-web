<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live GPS Tracker - Global</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff}.header{padding:12px 16px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:700;cursor:pointer}#map{height:78vh;width:100%}.info{background:#fff;color:#000;margin:10px;border-radius:12px;padding:12px}.dot{width:12px;height:12px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}</style></head><body>
<div class="header"><b>📍 LIVE GPS - Caregiver Tracking</b><div><a href="index.html" style="color:#fff;background:#2563eb;padding:8px 10px;border-radius:8px;text-decoration:none">🏠 Home</a> <a href="dashboard.html" style="color:#fff;background:#334155;padding:8px 10px;border-radius:8px;text-decoration:none">📊 Dashboard</a></div></div>
<div class="info"><span class="dot"></span> <b id="status">Live Tracking ON - Worldwide</b> | Caregiver: <b id="caregiverName">Sarah - Kampala, Uganda</b> | <span id="coords">Getting GPS...</span><br><small>🔋 Battery: 89% | 🕒 Last update: <span id="time">now</span> | 🌍 Accuracy: 5m</small></div>
<div id="map"></div>
<div style="padding:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="background:#22c55e;color:#fff;flex:1" onclick="startTrack()">▶️ Start Live Tracking</button><button class="btn" style="background:#ef4444;color:#fff;flex:1" onclick="stopTrack()">⏹️ Stop</button><button class="btn" style="background:#2563eb;color:#fff;flex:1" onclick="shareLocation()">📤 Share Location</button></div>
<script>
let map=L.map('map').setView([0.3476,32.5825],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker=L.marker([0.3476,32.5825]).addTo(map).bindPopup('Caregiver Sarah - Live Location').openPopup();
let watchId=null;
function updatePos(pos){
 let lat=pos.coords.latitude, lng=pos.coords.longitude;
 marker.setLatLng([lat,lng]); map.setView([lat,lng],15);
 document.getElementById('coords').textContent=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
 document.getElementById('time').textContent=new Date().toLocaleTimeString();
 localStorage.setItem('lastLocation',JSON.stringify({lat,lng,time:Date.now()}));
}
function startTrack(){
 if(navigator.geolocation){
  document.getElementById('status').textContent='🔴 LIVE - Tracking Active';
  watchId=navigator.geolocation.watchPosition(updatePos,err=>alert(err.message),{enableHighAccuracy:true,maximumAge:0});
 } else alert('GPS not supported');
}
function stopTrack(){if(watchId)navigator.geolocation.clearWatch(watchId); document.getElementById('status').textContent='⏸️ Tracking Paused';}
function shareLocation(){
 let loc=JSON.parse(localStorage.getItem('lastLocation')||'{"lat":0.3476,"lng":32.5825}');
 let url=`https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
 if(navigator.share)navigator.share({title:'My Live Location',url}); else prompt('Share this location:',url);
}
// auto start + load caregiver name
let caregivers=JSON.parse(localStorage.getItem('caregivers')||'[]');
if(caregivers[0])document.getElementById('caregiverName').textContent=caregivers[0].name+' - '+caregivers[0].country;
startTrack();
</script></body></html>
