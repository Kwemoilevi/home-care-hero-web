<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pharmacy</title>
<style>body{font-family:Arial;padding:20px;background:#f5f7fb}.card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center}.order{background:#0a7a07;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer}</style>
</head>
<body>
<h2>City Pharmacy - REAL Orders = REAL UGX 500</h2>
<div id="products"></div>
<a href="admin.html">Go to Admin REAL Revenue</a> | <a href="index.html">Home</a>

<script type="module">
import { trackView, trackClick } from "./firebase.js";
await trackView("pharmacy","city-pharma");

const items=[
{name:"Paracetamol 500mg",price:"5,000 UGX"},
{name:"Amoxicillin 500mg",price:"12,000 UGX"},
{name:"Vitamin C",price:"8,000 UGX"},
{name:"ORS Sachet",price:"1,500 UGX"}
];

const div=document.getElementById('products');
items.forEach(p=>{
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<div><b>${p.name}</b><br><small>${p.price}</small></div><button class="order">Order</button>`;
  el.querySelector('button').onclick=async()=>{
    await trackClick("product_order","city-pharma",p.name);
    alert(`REAL! Order tracked: ${p.name} - You earned UGX 500 REAL. Check admin.html`);
  };
  div.appendChild(el);
});
</script>
</body>
</html>
