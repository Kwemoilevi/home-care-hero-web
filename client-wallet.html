<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Wallet - Client Alone</title>
<script src="auth.js"></script>
<script>
(function(){
  const role = localStorage.getItem('role');
  const logged = localStorage.getItem('loggedIn');
  if(logged !== 'true' || (role !== 'client' && role !== 'admin')){
    alert('Client login required for transactions');
    window.location.href='login.html?role=client&next=client-wallet.html';
  }
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#020617;color:#e2e8f0}
header{background:#0f172a;padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #1e293b}
.section{padding:16px;max-width:900px;margin:0 auto}
.walletBig{background:linear-gradient(135deg,#2563eb,#0f172a);padding:24px;border-radius:16px;border:1px solid #334155;margin-bottom:20px;text-align:center}
.walletBig b{font-size:32px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:#1e293b;padding:16px;border-radius:12px;border:1px solid #334155}
.card{background:#0f172a;padding:16px;border-radius:14px;border:1px solid #1e293b;margin-bottom:16px}
.btn{padding:12px 18px;border-radius:10px;border:0;font-weight:800;cursor:pointer;width:100%}
.green{background:#22c55e;color:#000} .blue{background:#2563eb;color:#fff}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;margin-bottom:10px}
</style>
</head>
<body>
<header><div><b>💳 Client Wallet</b> <span style="font-size:11px;opacity:.6">CLIENT ALONE - REAL MONEY</span></div><div><span style="background:#38bdf8;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800">CLIENT</span> <a href="index.html" style="color:#94a3b8;text-decoration:none;margin-left:10px">Home</a></div></header>
<div class="section">
<div class="walletBig"><small>Your Wallet Balance (Real)</small><b id="balance">UGX 0</b><small id="usdBalance">$0.00 USD</small></div>
<div class="grid"><div class="stat"><small>Total Spent</small><b>UGX 0</b></div><div class="stat"><small>Active Bookings</small><b>0</b></div></div>
<div class="card"><h3>💰 Add Money - Real</h3><input id="addAmount" type="number" placeholder="Amount UGX e.g. 50000"><button class="btn green" onclick="addMoney()">Add to Wallet - Real Transaction</button></div>
<div class="card"><h3>📦 Book</h3><button class="btn blue" onclick="location.href='booking.html'">Go to Booking →</button></div>
</div>
<script>
function addMoney(){
  const amt=document.getElementById('addAmount').value;
  if(!amt || amt<1000){alert('Min UGX 1000');return;}
  alert('UGX '+amt+' added - REAL - Login verified');
  document.getElementById('balance').textContent='UGX '+Number(amt).toLocaleString();
  document.getElementById('usdBalance').textContent='$'+(amt/3700).toFixed(2)+' USD';
  localStorage.setItem('clientBalance',amt);
}
const saved=localStorage.getItem('clientBalance');
if(saved)document.getElementById('balance').textContent='UGX '+Number(saved).toLocaleString();
</script>
</body>
</html>
