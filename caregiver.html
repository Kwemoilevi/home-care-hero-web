<script>
// Auto share caregiver GPS
if(navigator.geolocation){
 navigator.geolocation.watchPosition(pos=>{
  localStorage.setItem('caregiverLocation', JSON.stringify({lat:pos.coords.latitude,lng:pos.coords.longitude,time:new Date().toLocaleString()}));
  console.log('Location shared', pos.coords.latitude);
 });
}
</script>
