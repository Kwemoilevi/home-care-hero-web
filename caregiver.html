<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caregiver - Home Care Hero</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto">
<div class="flex justify-between items-center"><h1 class="font-black text-xl">👩‍⚕️ Caregiver</h1><div class="flex gap-2 text-[11px]"><a href="index.html" class="bg-white border px-2 py-2 rounded-full">Home</a><a href="admin.html" class="bg-white border px-2 py-2 rounded-full">Admin</a><a href="client.html" class="bg-white border px-2 py-2 rounded-full">Client</a></div></div>
<div id="loginBox" class="bg-white p-5 rounded-2xl mt-4 shadow"><h2 class="font-bold">Caregiver Login</h2><p class="text-xs text-gray-500">Enter name + code</p><input id="cgName" placeholder="Your Name e.g Nakato Grace" class="w-full mt-3 px-4 py-3 rounded-xl border bg-gray-50 text-sm"><input id="cgCode" placeholder="Code e.g NAKATO123" class="w-full mt-2 px-4 py-3 rounded-xl border bg-gray-50 text-sm"><button onclick="cgLogin()" class="w-full mt-3 bg-black text-white py-3 rounded-xl font-bold text-sm">Login & See My Jobs</button><p class="text-[11px] text-gray-400 mt-2">Demo: NAKATO123 / AISHA123 / MARY123</p></div>
<div id="dashBox" class="hidden">
<div class="bg-white p-4 rounded-2xl mt-4 shadow"><div class="flex items-center gap-3"><div class="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center text-white font-black text-xl" id="cgAvatar">N</div><div><p id="cgNameShow" class="font-bold">Nakato</p><p class="text-xs text-green-600">● Online - Ready</p></div></div><button onclick="shareLocation()" class="w-full mt-3 bg-emerald-600 text-white py-2 rounded-xl font-bold text-sm">📍 SHARE MY LIVE LOCATION</button><p id="cgLoc" class="text-[11px] text-center text-gray-500 mt-1">Location: Not shared</p><div class="grid grid-cols-2 gap-2 mt-3 text-center"><div class="bg-gray-50 p-2 rounded-xl"><p class="text-xs text-gray-500">Jobs</p><p id="todayJobs" class="font-black">0</p></div><div class="bg-gray-50 p-2 rounded-xl"><p class="text-xs text-gray-500">Earnings</p><p id="earnings" class="font-black text-emerald-600">0</p></div></div></div>
<div class="bg-white p-4 rounded-2xl mt-4 shadow"><div class="flex justify-between"><h2 class="font-bold">My Jobs - From Firebase</h2><button onclick="loadJobs()" class="text-xs bg-black text-white px-3 py-1 rounded-full">Refresh</button></div><div id="jobsList" class="mt-3 space-y-3"><p>Loading...</p></div></div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCpjdPtSWfey4H55hWx9pd_7IWWpVF4ne8", authDomain: "home-care-hero.firebaseapp.com", projectId: "home-care-hero", storageBucket: "home-care-hero.firebasestorage.app", messagingSenderId: "38632827016", appId: "1:38632827016:web:0ebca8c98541b2fb3e573d", measurementId: "G-ZV09KN6R90" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let cgNameGlobal="";
window.cgLogin=function(){ let n=document.getElementById('cgName').value.trim(); let c=document.getElementById('cgCode').value.trim(); if(!n||!c){ alert('Enter name and code'); return; } cgNameGlobal=n; document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dashBox').classList.remove('hidden'); document.getElementById('cgNameShow').textContent=n+' • '+c; document.getElementById('cgAvatar').textContent=n.charAt(0); loadJobs(); }
window.shareLocation=function(){ if(!navigator.geolocation){ alert('GPS not supported'); return; } navigator.geolocation.getCurrentPosition(pos=>{ document.getElementById('cgLoc').innerHTML=`✅ Live: <b>${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}</b> • <a href="https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}" target="_blank" class="underline">View Map</a>`; }); }
window.loadJobs=async function(){ try{ const q=query(collection(db,"bookings"),orderBy("created","desc")); const snap=await getDocs(q); let html=""; let cnt=0; let earn=0; snap.forEach(d=>{ let b=d.data(); cnt++; earn+=(b.price||0); html+=`<div class="border p-3 rounded-xl bg-gray-50"><div class="flex justify-between"><b>${b.id||''}</b><span class="text-[11px] bg-emerald-100 px-2 py-1 rounded-full">${b.status||'BOOKED'}</span></div><p class="text-sm mt-1"><b>${b.name||''}</b> - ${b.phone||''} • ${b.location||''}</p><p class="text-xs">${b.service||''} • Total ${(b.price||0).toLocaleString()} • Balance ${(b.balance||0).toLocaleString()}</p><div class="flex gap-2 mt-2"><a href="https://wa.me/256${(b.phone||'').replace(/^0/,'')}?text=Hello I am ${encodeURIComponent(cgNameGlobal)} your caregiver. On my way!" target="_blank" class="flex-1 text-center bg-[#25D366] text-white py-2 rounded-full text-xs font-bold">WhatsApp Client</a><a href="tel:${b.phone||''}" class="flex-1 text-center bg-black text-white py-2 rounded-full text-xs font-bold">Call</a></div></div>`; }); if(cnt===0) html='<p>No jobs yet</p>'; document.getElementById('jobsList').innerHTML=html; document.getElementById('todayJobs').textContent=cnt; document.getElementById('earnings').textContent=earn.toLocaleString()+' UGX'; }catch(e){ document.getElementById('jobsList').innerHTML='Error: '+e.message; } }
</script>
</body>
</html>
