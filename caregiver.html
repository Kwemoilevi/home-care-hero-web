<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caregivers - Home Care Hero</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f7fb;padding:16px}
.header{background:#0f172a;color:white;padding:16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card{background:white;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);margin-bottom:16px}
input,select{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;margin:6px 0}
.btn{padding:12px 18px;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
.item{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between}
.btn-sm{padding:6px 10px;font-size:12px;width:auto;background:#ef4444}
a{color:white;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <div><b>👩‍⚕️ Caregivers</b><br><small>ALL SYSTEM</small></div>
  <div style="display:flex;gap:8px"><a href="dashboard.html" style="background:#334155;padding:8px 12px;border-radius:8px">Dashboard</a><a href="clients.html" style="background:#2563eb;padding:8px 12px;border-radius:8px">Clients</a></div>
</div>

<div class="card">
  <h3>Add New Caregiver</h3>
  <input id="name" placeholder="Full Name - e.g. Sarah Namatovu">
  <input id="service" placeholder="Service - Elderly Care / Child Care / Nursing">
  <input id="phone" placeholder="Phone - 077...">
  <input id="location" placeholder="Location - Kampala">
  <button class="btn" onclick="addCaregiver()">+ Add Caregiver</button>
</div>

<div class="card">
  <h3>Caregivers List (<span id="count">0</span>)</h3>
  <div id="list"></div>
</div>

<script>
const API="https://home-care-hero-api.onrender.com";
let caregivers = JSON.parse(localStorage.getItem('caregivers')||'[]');
if(!caregivers.length) caregivers=[{name:'Sample Caregiver - Sarah',service:'Elderly Care',phone:'0772101875',location:'Kampala'}];

function save(){localStorage.setItem('caregivers',JSON.stringify(caregivers)); render();}

function render(){
  document.getElementById('count').textContent=caregivers.length;
  document.getElementById('list').innerHTML=caregivers.map((c,i)=>`
    <div class="item"><div><b>${c.name}</b><br><small>${c.service} • ${c.location} • ${c.phone}</small></div><button class="btn btn-sm" onclick="del(${i})">Delete</button></div>
  `).join('') || '<p style="color:#94a3b8">No caregivers</p>';
}

async function addCaregiver(){
  const obj={name:document.getElementById('name').value,service:document.getElementById('service').value,phone:document.getElementById('phone').value,location:document.getElementById('location').value};
  if(!obj.name) return alert('Enter name');
  caregivers.unshift(obj); save();
  document.getElementById('name').value='';document.getElementById('service').value='';document.getElementById('phone').value='';document.getElementById('location').value='';
  try{await fetch(API+'/caregivers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)})}catch{}
}

function del(i){ if(confirm('Delete?')){ caregivers.splice(i,1); save(); } }

render();
try{fetch(API+'/caregivers').then(r=>r.json()).then(d=>{ if(d.length){caregivers=d; save();} })}catch{}
</script>
</body>
</html>
