<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Caregiver</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50"><div id="L" class="min-h-screen flex items-center justify-center p-6"><div class="bg-white p-7 rounded-[2rem] shadow-xl w-full max-w-sm border"><h1 class="font-black">Caregiver Login</h1><input id="p" placeholder="0772101875" class="w-full mt-4 px-4 py-3 rounded-xl border bg-gray-50 font-bold"><button onclick="login()" class="w-full mt-3 bg-black text-white py-3 rounded-xl font-bold">See Jobs</button><p id="e" class="hidden text-red-500 text-xs mt-2">Not approved. Call CEO.</p><a href="/caregiver-register.html" class="text-xs underline">Apply as new caregiver</a></div></div><div id="D" class="hidden"><nav class="bg-black text-white px-6 py-4 flex justify-between"><b>MY JOBS</b><span id="n" class="text-xs bg-white/20 px-3 py-1 rounded-full"></span></nav><div class="p-4 max-w-xl mx-auto"><div id="list"></div></div></div><script>let cp='';function login(){let ph=document.getElementById('p').value.replace(/\D/g,'');cp=ph;let apps=JSON.parse(localStorage.getItem('hch_caregiver_apps')||'[]');let appr=JSON.parse(localStorage.getItem('hch_approved_caregivers')||'[]');let f=[...apps,...appr].find(a=>a.phone.replace(/\D/g,'').slice(-9)===ph.slice(-9));if(!f&&ph.slice(-9)!=='772101875'){document.getElementById('e').classList.remove('hidden');return;}document.getElementById('L').classList.add('hidden');document.getElementById('D').classList.remove('hidden');document.getElementById('n').textContent=f?f.name:'CEO';let books=JSON.parse(localStorage.getItem('hch_bookings')||'[]');let my=books;if(ph.slice(-9)!=='772101875')my=books.filter(b=>b.caregiverPhone&&b.caregiverPhone.replace(/\D/g,'').slice(-9)===ph.slice(-9));let h='';if(my.length===0)h='<p class="text-center text-xs text-gray-500 mt-10">No jobs yet.</p>';my.forEach(b=>{h+=`<div class="bg-white p-4 rounded-2xl border mt-3"><p class="font-black text-sm">${b.id} - ${b.name}</p><p class="text-xs">${b.phone} - ${b.price} UGX - ${b.status}</p><div class="flex gap-2 mt-2"><select onchange="upd('${b.id}',this.value)" class="text-xs bg-black text-white px-3 py-1 rounded-full"><option>Update</option><option>on the way</option><option>active</option><option>completed</option></select><a href="https://wa.me/${b.phone.replace(/[^0-9]/g,'')}" class="text-xs bg-green-500 text-white px-3 py-1 rounded-full">Call</a></div></div>`});document.getElementById('list').innerHTML=h;}function upd(id,s){let a=JSON.parse(localStorage.getItem('hch_bookings')||'[]');let i=a.findIndex(b=>b.id===id);if(i>-1){a[i].status=s;localStorage.setItem('hch_bookings',JSON.stringify(a));alert('Updated: '+s);}}</script></body></html>
