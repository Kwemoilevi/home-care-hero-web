<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nurse Dashboard</title></head>
<body style="margin:0;background:#f8fafc;font-family:sans-serif;display:flex;justify-content:center;padding:12px;">
<div style="width:100%;max-width:400px;">
<div style="display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:white;padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:11px;"><span id="who">👋 Nurse</span><button onclick="localStorage.removeItem('hch_role');localStorage.removeItem('hch_user');location.href='login.html'" style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:8px;font-weight:bold;">Logout</button></div><script>let u=localStorage.getItem('hch_user');try{u=JSON.parse(u).name||u}catch(e){}document.getElementById('who').innerText='👋 '+ (u||'Nurse') +' • NURSE';if(!localStorage.getItem('hch_role')){location.href='login.html';}</script>
<div style="background:#0f172a;color:white;border-radius:16px;padding:16px;text-align:center;"><h2 style="margin:0;">👩‍⚕️ Nurse Dashboard</h2><p style="margin:6px 0 0 0;color:#86efac;font-size:11px;">Serve with heart • LIVE GPS</p></div>
<div style="background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-top:12px;text-align:center;">
<p style="margin:0;font-size:13px;font-weight:bold;">📍 Your LIVE GPS</p>
<p id="gpsStatus" style="margin:8px 0 0 0;font-size:11px;color:#64748b;">GPS OFF - Click START</p>
<button id="gpsBtn" onclick="toggleGPS()" style="width:100%;background:#22c55e;color:white;padding:14px;border-radius:12px;border:none;font-weight:900;margin-top:12px;">📍 START GPS</button>
</div>
<div style="background:white;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin-top:12px;"><h3 style="margin:0;font-size:12px;">📋 Assigned Clients</h3><div id="list" style="margin-top:8px;font-size:12px;">Loading...</div></div>
<a href="index.html" style="display:block;text-align:center;color:#64748b;font-size:11px;margin-top:12px;text-decoration:none;">← Home</a>
</div>
<script>
let watchId=null;
function toggleGPS(){let btn=document.getElementById('gpsBtn');let st=document.getElementById('gpsStatus');if(watchId){navigator.geolocation.clearWatch(watchId);watchId=null;btn.innerText='📍 START GPS';btn.style.background='#22c55e';st.innerText='GPS OFF';localStorage.removeItem('nurse_gps');return;}if(!navigator.geolocation){st.innerText='GPS not supported';return;}watchId=navigator.geolocation.watchPosition(pos=>{let d={lat:pos.coords.latitude,lng:pos.coords.longitude,time:new Date().toISOString()};localStorage.setItem('nurse_gps',JSON.stringify(d));st.innerText=`LIVE: ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`;btn.innerText='🟢 GPS LIVE';btn.style.background='#0f172a';},err=>{st.innerText='Error: '+err.message;},{enableHighAccuracy:true});}
function load(){let bks=JSON.parse(localStorage.getItem('hch_bookings')||'[]');let h='';if(bks.length==0)h='<p style=color:#94a3b8>No bookings</p>';else bks.slice().reverse().forEach(b=>{h+=`<div style="border:1px solid #e2e8f0;border-radius:8px;padding:8px;margin-top:6px;"><b>${b.name}</b> • ${b.phone}<br><span style=color:#64748b>${b.location} • ${b.service}</span></div>`});document.getElementById('list').innerHTML=h;}
load();setInterval(load,3000);
</script>
</body></html>
