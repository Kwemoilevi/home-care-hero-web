<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BetPawa Payment</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;padding:14px}.card{background:#fff;color:#000;border-radius:16px;padding:18px;max-width:420px;margin:0 auto}.m{border:2px solid #e2e8f0;padding:12px;border-radius:10px;text-align:center;cursor:pointer;font-weight:700}.m.active{border-color:#22c55e;background:#dcfce7}input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin:6px 0}.btn{width:100%;padding:14px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}.betpawa{background:linear-gradient(90deg,#22c55e,#16a34a);padding:10px;border-radius:10px;text-align:center;color:#fff;font-weight:800;margin-bottom:12px}</style></head><body>
<div class="card"><div class="betpawa">💰 BETPAWA STYLE PAYMENT</div><h3 id="payTitle">Pay for Caregiver</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0"><div class="m active" onclick="sel(this,'MTN')">📱 MTN MoMo</div><div class="m" onclick="sel(this,'Airtel')">📱 Airtel</div><div class="m" onclick="sel(this,'Visa')">💳 Visa</div><div class="m" onclick="sel(this,'PayPal')">🌍 PayPal</div></div><input id="amount" value="50000" placeholder="Amount"><input id="phone" placeholder="Phone +256 / +1 / +44 *"><input id="email" placeholder="Email receipt"><button class="btn" onclick="pay()">🔒 PAY NOW</button><div id="ok" style="display:none;background:#dcfce7;padding:12px;border-radius:10px;margin-top:12px;text-align:center"><b>✅ Payment Success!</b><br><small id="receipt"></small><br><br><a href="tracker.html" style="background:#2563eb;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none">📍 Track Now</a></div><p style="text-align:center;margin-top:10px"><a href="index.html" style="color:#2563eb;font-weight:700;text-decoration:none">← Home</a></p></div>
<script>let method='MTN';function sel(el,m){method=m;document.querySelectorAll('.m').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('amount').value=(m=='Visa'||m=='PayPal')?'50':'50000';}function pay(){let phone=document.getElementById('phone').value,amount=document.getElementById('amount').value;if(!phone)return alert('Enter phone');let p={method,phone,amount,time:new Date().toLocaleString(),status:'SUCCESS',txn:'TXN'+Date.now()};let ps=JSON.parse(localStorage.getItem('payments')||'[]');ps.unshift(p);localStorage.setItem('payments',JSON.stringify(ps));document.getElementById('receipt').innerText=method+' '+amount+' from '+phone+' - '+p.txn;document.getElementById('ok').style.display='block';}</script></body></html>
