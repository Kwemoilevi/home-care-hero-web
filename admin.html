<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CEO Dashboard</title></head>
<body style="margin:0;background:#f8fafc;font-family:sans-serif;display:flex;justify-content:center;padding:12px;">
<div style="width:100%;max-width:520px;">
<div style="display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:white;padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:11px;"><span id="who">👋 Loading...</span><button onclick="localStorage.removeItem('hch_role');localStorage.removeItem('hch_user');location.href='login.html'" style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:8px;font-weight:bold;cursor:pointer;">Logout 🔓</button></div><script>let u=localStorage.getItem('hch_user');try{u=JSON.parse(u).name||u}catch(e){}document.getElementById('who').innerText='👋 '+ (u||'Guest') +' • CEO • Karibu';if(localStorage.getItem('hch_role')!='ceo'){location.href='login.html';}</script>
<div style="background:#0f172a;color:white;border-radius:16px;padding:16px;text-align:center;"><h2 style="margin:0;">👨‍💼 CEO Command Center</h2><p style="margin:6px 0 0 0;color:#94a3b8;font-size:11px;">LIVE Bookings • LIVE GPS • REAL Wallet</p></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
<div style="background:#22c55e;color:white;border-radius:12px;padding:12px;text-align:center;"><p style="margin:0;font-size:11px;">Wallet</p><p id="bal" style="margin:4px 0 0 0;font-weight:900;">UGX 0</p></div>
<div style="background:white;border:1px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center;"><p style="margin:0;font-size:11px;color:#64748b;">Bookings</p><p id="cnt" style="margin:4px 0 0 0;font-weight:900;">0</p></div>
</div>
<div style="background:white;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin-top:12px;"><h3 style="margin:0;font-size:13px;">📋 LIVE Bookings</h3><div id="list" style="margin-top:10px;font-size:12px;">Loading...</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
<a href="admin-live-map.html" style="background:#0f172a;color:white;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold;font-size:12px;">📍 LIVE GPS MAP</a>
<a href="wallet.html" style="background:#22c55e;color:white;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold;font-size:12px;">💰 Wallet</a>
</div>
<a href="index.html" style="display:block;text-align:center;color:#64748b;font-size:11px;margin-top:12px;text-decoration:none;">← Back Home</a>
</div>
<script>
function load(){let bks=JSON.parse(localStorage.getItem('hch_bookings')||'[]');document.getElementById('cnt').innerText=bks.length;document.getElementById('bal').innerText='UGX '+Number(localStorage.getItem('ceo_bal')||'0').toLocaleString();let h='';if(bks.length==0)h='<p style=color:#94a3b8>No bookings yet</p>';bks.slice().reverse().forEach((bk,i)=>{h+=`<div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-top:8px;"><p style="margin:0;font-weight:bold;">${bk.name||'Client'} • ${bk.phone||''}</p><p style="margin:4px 0 0 0;color:#64748b;">${bk.service||''} • ${bk.location||''}</p><button onclick="confirmBk(${bks.length-1-i})" style="background:#22c55e;color:white;border:none;padding:6px 10px;border-radius:6px;margin-top:6px;font-weight:bold;">Confirm +7k</button></div>`});document.getElementById('list').innerHTML=h;}
function confirmBk(idx){let bks=JSON.parse(localStorage.getItem('hch_bookings')||'[]');let bal=Number(localStorage.getItem('ceo_bal')||'0');bal+=7000;localStorage.setItem('ceo_bal',bal);let cnt=Number(localStorage.getItem('ceo_cnt')||'0');localStorage.setItem('ceo_cnt',cnt+1);alert('Confirmed! +7k added');load();}
load();setInterval(load,3000);
</script>
</body></html>
