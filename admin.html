<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard - Home Care Hero</title>
<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
header{background:#0a7a42;color:white;padding:15px;display:flex;justify-content:space-between}
.container{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.card{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card h2{color:#0a7a42;margin:0}
table{width:100%;border-collapse:collapse;background:white;margin-top:20px;border-radius:10px;overflow:hidden}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
th{background:#0a7a42;color:white}
.btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer}
.btn-green{background:#0a7a42;color:white}
.btn-red{background:#e11d48;color:white}
a{color:#0a7a42;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header>
<div><b>Admin Dashboard</b> - Home Care Hero</div>
<div><a href="index.html" style="color:white">Home</a> | <a href="admin-login.html" style="color:white">Logout</a></div>
</header>
<div class="container">
<div class="grid">
<div class="card"><h2 id="totalClients">0</h2><p>Total Clients</p></div>
<div class="card"><h2 id="totalCaregivers">0</h2><p>Total Caregivers</p></div>
<div class="card"><h2 id="totalBookings">0</h2><p>Total Bookings</p></div>
<div class="card"><h2 id="totalWallet">UGX 0</h2><p>Wallet Balance</p></div>
</div>

<h2 style="margin-top:30px">Recent Bookings</h2>
<table>
<thead><tr><th>Client</th><th>Caregiver</th><th>Service</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="bookingTable"></tbody>
</table>

<p style="margin-top:20px"><a href="index.html">← Back Home</a> | <a href="client-wallet.html">View Wallet</a> | <a href="privacy.html">Privacy</a></p>
</div>

<script>
// Load from localStorage (demo data if empty)
let bookings = JSON.parse(localStorage.getItem('hch_bookings') || '[]');
if(bookings.length===0){
  bookings = [
    {client:'John Makindye',caregiver:'Grace N.',service:'Nanny',amount:50000,status:'Paid'},
    {client:'Sarah Nakawa',caregiver:'David K.',service:'Nurse',amount:80000,status:'Pending'}
  ];
  localStorage.setItem('hch_bookings', JSON.stringify(bookings));
}
function render(){
  document.getElementById('totalClients').innerText = 12 + bookings.length;
  document.getElementById('totalCaregivers').innerText = 8;
  document.getElementById('totalBookings').innerText = bookings.length;
  let total = bookings.reduce((s,b)=>s+b.amount,0);
  document.getElementById('totalWallet').innerText = 'UGX '+total.toLocaleString();
  let html='';
  bookings.forEach((b,i)=>{
    html+=`<tr><td>${b.client}</td><td>${b.caregiver}</td><td>${b.service}</td><td>UGX ${b.amount}</td><td>${b.status}</td><td><button class="btn btn-green" onclick="approve(${i})">Approve</button> <button class="btn btn-red" onclick="remove(${i})">Delete</button></td></tr>`;
  });
  document.getElementById('bookingTable').innerHTML=html;
}
function approve(i){bookings[i].status='Approved';localStorage.setItem('hch_bookings',JSON.stringify(bookings));render();}
function remove(i){bookings.splice(i,1);localStorage.setItem('hch_bookings',JSON.stringify(bookings));render();}
render();
</script>
</body>
</html>
