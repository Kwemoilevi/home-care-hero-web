<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard - Home Care Hero</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.header{background:#111;padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #222}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#171717;border:1px solid #262626;border-radius:14px;padding:16px}
.card small{color:#9ca3af;font-size:11px;text-transform:uppercase}
.card h2{font-size:24px;margin-top:4px}
.card h2 span{color:#facc15}
table{width:100%;border-collapse:collapse;margin:16px;background:#171717;border-radius:12px;overflow:hidden}
th,td{padding:12px 10px;text-align:left;font-size:13px;border-bottom:1px solid #262626}
th{background:#111;color:#9ca3af;font-size:11px;text-transform:uppercase}
.btn{padding:6px 12px;border-radius:8px;border:none;font-weight:700;font-size:12px;cursor:pointer}
.btn-green{background:#16a34a;color:#fff}
.btn-yellow{background:#facc15;color:#000}
.btn-red{background:#dc2626;color:#fff}
</style>
</head>
<body>
<div class="header">
<div><b>ADMIN</b> <span style="color:#facc15">DASHBOARD</span></div>
<div><a href="index.html" style="color:#fff;text-decoration:none;font-size:13px">Home</a> • <a href="login.html" style="color:#9ca3af;text-decoration:none;font-size:13px">Logout</a></div>
</div>

<div class="grid">
<div class="card"><small>Total Balance</small><h2><span>UGX</span> <span id="total">0</span></h2></div>
<div class="card"><small>Total Bookings</small><h2 id="bookings">0</h2></div>
<div class="card"><small>Commission (15%)</small><h2><span>UGX</span> <span id="comm">0</span></h2></div>
<div class="card"><small>Active Caregivers</small><h2 id="caregivers">12</h2></div>
</div>

<table>
<thead><tr><th>Service</th><th>Amount</th><th>Caregiver Gets (85%)</th><th>You Keep</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<div style="padding:16px;display:flex;gap:10px">
<button class="btn btn-yellow" onclick="location.href='index.html'">← Home</button>
<button class="btn btn-green" onclick="autoPayoutAll()">Auto Payout All Caregivers</button>
<button class="btn btn-red" onclick="clearAll()">Clear Data</button>
</div>

<script>
let bookings = JSON.parse(localStorage.getItem('hch_bookings')||'[]');
function render(){
  let total=0, comm=0;
  let html='';
  bookings.forEach((b,i)=>{
    const caregiverAmt = b.caregiverAmount || Math.floor(b.amount*0.85);
    const fee = b.fee || (b.amount - caregiverAmt);
    total+=b.amount; comm+=fee;
    html+=`<tr><td>${b.service}</td><td>UGX ${b.amount.toLocaleString()}</td><td>UGX ${caregiverAmt.toLocaleString()}</td><td>UGX ${fee.toLocaleString()}</td><td style="color:#22c55e">${b.status}</td><td><button class="btn btn-green" onclick="payout(${i})">Pay</button> <button class="btn btn-red" onclick="del(${i})">X</button></td></tr>`;
  });
  if(!html) html='<tr><td colspan="6" style="text-align:center;color:#6b7280">No bookings yet - Bookings from homepage appear here automatically</td></tr>';
  document.getElementById('tbody').innerHTML=html;
  document.getElementById('total').innerText=total.toLocaleString();
  document.getElementById('comm').innerText=comm.toLocaleString();
  document.getElementById('bookings').innerText=bookings.length;
}
function payout(i){
  const b=bookings[i];
  fetch('/api/momo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'disburse',amount:b.amount,caregiverPhone:'256700000001'})});
  b.status='Paid to Caregiver - Auto';
  localStorage.setItem('hch_bookings',JSON.stringify(bookings));
  render(); alert(`Auto-sent UGX ${(b.caregiverAmount||Math.floor(b.amount*0.85)).toLocaleString()} to caregiver`);
}
function autoPayoutAll(){
  if(bookings.length===0) return alert('No bookings');
  if(!confirm(`Auto payout all ${bookings.length} caregivers?`)) return;
  bookings.forEach(b=>b.status='Paid to Caregiver - Auto');
  localStorage.setItem('hch_bookings',JSON.stringify(bookings));
  render(); alert('All caregivers paid automatically (85% each)');
}
function del(i){bookings.splice(i,1);localStorage.setItem('hch_bookings',JSON.stringify(bookings));render()}
function clearAll(){if(confirm('Clear all?')){localStorage.removeItem('hch_bookings');bookings=[];render()}}
render();
</script>
</body>
</html>
