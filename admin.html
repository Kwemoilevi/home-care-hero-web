<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard - Home Care Hero</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.header{background:#111;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0}
.logo{font-weight:800}
.logo span{color:#facc15}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#171717;border:1px solid #262626;border-radius:14px;padding:16px}
.card small{color:#9ca3af;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.card h2{font-size:26px;margin-top:6px;font-weight:900}
.card h2 span{color:#facc15}
.table-wrap{margin:16px;background:#171717;border-radius:14px;border:1px solid #262626;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;text-align:left;font-size:13px;border-bottom:1px solid #262626;white-space:nowrap}
th{background:#111;color:#9ca3af;font-size:11px;text-transform:uppercase}
.btn{padding:7px 14px;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
.btn-g{background:#16a34a;color:#fff}
.btn-y{background:#facc15;color:#000}
.btn-r{background:#222;color:#9ca3af}
.actions{padding:16px;display:flex;gap:10px;flex-wrap:wrap}
.footer{padding:20px;text-align:center;color:#555;font-size:11px}
</style>
</head>
<body>
<div class="header">
<div class="logo">ADMIN <span>DASHBOARD</span></div>
<div style="display:flex;gap:12px;font-size:13px">
<a href="index.html" style="color:#fff;text-decoration:none">Home</a>
<a href="momo-wallet.html" style="color:#facc15;text-decoration:none">Wallet</a>
<a href="login.html" style="color:#9ca3af;text-decoration:none">Logout</a>
</div>
</div>

<div class="grid">
<div class="card"><small>Total Collected</small><h2><span>UGX</span> <span id="total">0</span></h2></div>
<div class="card"><small>Total Bookings</small><h2 id="count">0</h2></div>
<div class="card"><small>Your Commission (15%)</small><h2><span>UGX</span> <span id="comm">0</span></h2></div>
<div class="card"><small>To Pay Caregivers (85%)</small><h2><span>UGX</span> <span id="pay">0</span></h2></div>
</div>

<div class="table-wrap">
<table>
<thead><tr><th>Date</th><th>Service</th><th>Amount</th><th>Caregiver Gets</th><th>You Keep</th><th>Status</th><th>Action</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="actions">
<button class="btn btn-y" onclick="location.href='index.html'">← Home</button>
<button class="btn btn-g" onclick="payoutAll()">Auto Payout All Caregivers</button>
<button class="btn btn-r" onclick="clearData()">Clear All</button>
<button class="btn btn-r" onclick="addTest()">+ Add Test Booking</button>
</div>

<div class="footer">Home Care Hero Admin • Auto Payments • Kampala<br>All payments automatic - 85% to caregiver, 15% commission</div>

<script>
let bookings = JSON.parse(localStorage.getItem('hch_bookings')||'[]');

function render(){
  let total=0, comm=0, pay=0;
  let html='';
  bookings.forEach((b,i)=>{
    const caregiverAmt = b.caregiverAmount || Math.floor(b.amount*0.85);
    const fee = b.fee || (b.amount - caregiverAmt);
    total+=b.amount; comm+=fee; pay+=caregiverAmt;
    const date = b.time || new Date().toLocaleString();
    html+=`<tr>
<td>${date}</td>
<td>${b.service}</td>
<td>UGX ${b.amount.toLocaleString()}</td>
<td>UGX ${caregiverAmt.toLocaleString()}</td>
<td>UGX ${fee.toLocaleString()}</td>
<td style="color:${b.status.includes('Paid')?'#22c55e':'#facc15'}">${b.status}</td>
<td><button class="btn btn-g" onclick="payout(${i})">Pay</button> <button class="btn btn-r" onclick="removeOne(${i})">Del</button></td>
</tr>`;
  });
  if(!html) html=`<tr><td colspan="7" style="text-align:center;padding:30px;color:#6b7280">No bookings yet<br><small>When clients book on homepage, they appear here automatically</small></td></tr>`;
  document.getElementById('tbody').innerHTML=html;
  document.getElementById('total').innerText=total.toLocaleString();
  document.getElementById('comm').innerText=comm.toLocaleString();
  document.getElementById('pay').innerText=pay.toLocaleString();
  document.getElementById('count').innerText=bookings.length;
}

function payout(i){
  const b=bookings[i];
  // Auto API call
  fetch('/api/momo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'disburse',amount:b.amount,caregiverPhone:'256700000001'})}).catch(()=>{});
  b.status='Paid to Caregiver - Auto';
  localStorage.setItem('hch_bookings',JSON.stringify(bookings));
  render();
  alert(`Auto-sent UGX ${(b.caregiverAmount||Math.floor(b.amount*0.85)).toLocaleString()} to ${b.service} caregiver`);
}

function payoutAll(){
  if(bookings.length===0) return alert('No bookings to payout');
  if(!confirm(`Auto payout ${bookings.length} caregivers 85% each?`)) return;
  bookings.forEach(b=>b.status='Paid to Caregiver - Auto');
  localStorage.setItem('hch_bookings',JSON.stringify(bookings));
  fetch('/api/momo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'disburse',amount:1000})}).catch(()=>{});
  render();
  alert('All caregivers paid automatically!');
}

function removeOne(i){ if(confirm('Delete this booking?')){ bookings.splice(i,1); localStorage.setItem('hch_bookings',JSON.stringify(bookings)); render(); } }
function clearData(){ if(confirm('Clear ALL bookings?')){ localStorage.removeItem('hch_bookings'); bookings=[]; render(); } }
function addTest(){
  bookings.push({service:'Nanny',amount:15000,caregiverAmount:12750,fee:2250,status:'Paid - Auto disbursing 85%',time:new Date().toLocaleString()});
  localStorage.setItem('hch_bookings',JSON.stringify(bookings));
  render();
}

render();
</script>
</body>
</html>
