<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Real Global</title>
<style>body{margin:0;font:14px system-ui;background:#f1f5f9}header{background:#0f172a;color:#fff;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0}.card{background:#fff;margin:10px;padding:12px;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;font-size:13px}.btn{padding:6px 10px;border:0;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px}.blue{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#ef4444;color:#fff}.badge{padding:2px 8px;border-radius:20px;font-size:11px}.pending{background:#fef3c7}.paid{background:#dcfce7}</style>
</head><body>
<header><div><b>🌍 Admin REAL</b> <small id="mode">CONNECTING...</small></div><div><a href="index.html" style="color:#60a5fa">Home</a> <button class="btn red" onclick="localStorage.clear();location.reload()">Clear</button></div></header>
<div class="card" style="border:2px solid #16a34a;background:#f0fdf4"><h3 style="margin:0">💰 Global Wallet REAL</h3><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-top:8px"><div><small>TOTAL</small><br><b id="wTot">0</b></div><div><small>PAID</small><br><b id="wPaid">0</b></div><div><small>PENDING</small><br><b id="wPend">0</b></div></div></div>
<div class="card"><div style="display:flex;gap:6px"><input id="q" placeholder="Search city country..." oninput="render()" style="flex:2;padding:8px;border-radius:8px;border:1px solid #ddd"><select id="cFilt" onchange="render()" style="flex:1;padding:8px;border-radius:8px"><option value="">All Countries</option></select><button class="btn blue" onclick="load()">↻ Real</button></div><div id="list" style="margin-top:10px">Loading real...</div></div>
<script>
let BOOKS=[];
async function load(){
 try{
  const r=await fetch('/api/bookings',{cache:'no-store'});
  if(r.ok){BOOKS=await r.json();document.getElementById('mode').innerText=`REAL LIVE (${BOOKS.length})`;render();return;}
 }catch(e){}
 BOOKS=JSON.parse(localStorage.getItem('bookings')||'[]');
 document.getElementById('mode').innerText='LOCAL FALLBACK';
 render();
}
function render(){
 const q=(document.getElementById('q').value||'').toLowerCase(),cf=document.getElementById('cFilt').value;
 const countries=[...new Set(BOOKS.map(b=>b.country).filter(Boolean))];
 const sel=document.getElementById('cFilt'),cur=sel.value;sel.innerHTML='<option value="">All Countries</option>';countries.forEach(c=>sel.innerHTML+=`<option ${c===cur?'selected':''}>${c}</option>`);
 let filt=BOOKS.filter(b=>{const t=(b.name+b.phone+b.location+b.country+b.city).toLowerCase();return t.includes(q)&&(!cf||b.country===cf);});
 document.getElementById('wTot').innerText=filt.length;document.getElementById('wPaid').innerText=filt.filter(b=>b.status==='paid').length;document.getElementById('wPend').innerText=filt.filter(b=>b.status!=='paid').length;
 let h='<table><tr><th>Client</th><th>Location</th><th>Status</th><th>Action</th></tr>';
 if(filt.length===0)h+='<tr><td colspan=4>No real bookings yet. Book from booking.html REAL</td></tr>';
 else filt.slice().reverse().forEach(b=>{h+=`<tr><td><b>${b.name}</b><br><small>${b.phone}</small><br><small>${b.currency} ${b.price}</small></td><td>${b.city||''}<br><small>${b.country||''} ${b.flag||''}</small><br><small>${b.location||''}</small></td><td><span class="badge ${b.status==='paid'?'paid':'pending'}">${b.status}</span><br><small>${b.service}</small></td><td><button class="btn blue" onclick="setS(${b.id},'paid')">Paid</button><br><button class="btn red" onclick="delB(${b.id})" style="margin-top:4px">Del</button></td></tr>`;});
 h+='</table>';document.getElementById('list').innerHTML=h;
}
function setS(id,s){BOOKS=BOOKS.map(b=>b.id==id?{...b,status:s}:b);render();}
async function delB(id){if(!confirm('Delete real?'))return;try{await fetch('/api/bookings?id='+id,{method:'DELETE'});}catch(e){}BOOKS=BOOKS.filter(b=>b.id!=id);render();}
load();
</script></body></html>
