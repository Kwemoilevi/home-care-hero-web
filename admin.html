<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin REAL Revenue</title>
<style>body{font-family:Arial;padding:20px;background:#111;color:white}.box{background:#222;padding:20px;border-radius:12px;margin:10px 0}.big{font-size:32px;color:#12d10e}.btn{background:#12d10e;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;margin:5px}</style>
</head>
<body>
<h1>Admin — REAL Revenue (Firebase)</h1>
<div class="box">Total Views: <span id="views" class="big">0</span> = UGX <span id="vUGX">0</span> (100 each)</div>
<div class="box">Total Clicks: <span id="clicks" class="big">0</span> = UGX <span id="cUGX">0</span> (500 each)</div>
<div class="box"><h2>TOTAL REAL: UGX <span id="total" class="big">0</span></h2><p id="status">Connecting to Firebase REAL...</p></div>
<button class="btn" onclick="load()">Refresh REAL</button>
<button class="btn" onclick="exportCSV()">Export CSV Invoice</button>
<br><br><a href="index.html" style="color:#12d10e">Home</a> | <a href="pharmacy.html" style="color:#12d10e">Pharmacy</a>

<script type="module">
import { getRevenue } from "./firebase.js";
window.load=async()=>{
  try{
    const r=await getRevenue();
    document.getElementById('views').textContent=r.views;
    document.getElementById('clicks').textContent=r.clicks;
    document.getElementById('vUGX').textContent=(r.views*100).toLocaleString();
    document.getElementById('cUGX').textContent=(r.clicks*500).toLocaleString();
    document.getElementById('total').textContent=r.total.toLocaleString();
    document.getElementById('status').textContent="REAL - Live from Firestore - Updates every 3 sec";
    window._last=r;
  }catch(e){
    document.getElementById('status').textContent="ERROR: "+e.message+" - Check firebase.js keys + Firestore Rules";
  }
};
window.exportCSV=()=>{
  if(!window._last) return alert("Load first");
  const csv=`Type,Count,Rate,Total\nViews,${window._last.views},100,${window._last.views*100}\nClicks,${window._last.clicks},500,${window._last.clicks*500}\nTOTAL,,,${window._last.total}`;
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`invoice-${Date.now()}.csv`; a.click();
};
load(); setInterval(load,3000);
</script>
</body>
</html>
