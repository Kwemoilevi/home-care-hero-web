<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Home Care Hero</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<!-- LOGIN -->
<div id="login" class="min-h-screen flex items-center justify-center p-6">
<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
<h1 class="text-2xl font-bold">Admin Login</h1>
<p class="text-sm text-gray-500 mt-1">Home Care Hero</p>
<input id="pass" type="password" placeholder="Enter admin password" class="w-full mt-6 px-4 py-3 rounded-xl border bg-gray-50">
<button onclick="doLogin()" class="w-full mt-4 bg-black text-white py-3 rounded-xl font-bold">Login</button>
<p class="text-xs text-gray-400 mt-3 text-center">New password: kwaliver92</p>
<p id="loginErr" class="text-sm text-red-500 mt-2 text-center"></p>
</div>
</div>
<!-- PANEL -->
<div id="panel" class="hidden">
<nav class="bg-black text-white px-6 py-4 flex justify-between items-center">
<div class="font-bold">Home Care Hero Admin 📍 Live Tracking Control</div>
<button onclick="localStorage.removeItem('hch_admin');location.reload()" class="text-xs bg-white/10 px-3 py-1 rounded-full">Logout</button>
</nav>
<div class="p-6 max-w-6xl mx-auto">
<div class="grid grid-cols-3 gap-4">
<div class="bg-white p-4 rounded-xl border"><p class="text-xs text-gray-400">TOTAL BOOKINGS</p><p id="total" class="text-2xl font-bold">0</p></div>
<div class="bg-white p-4 rounded-xl border"><p class="text-xs text-gray-400">ON THE WAY</p><p id="onway" class="text-2xl font-bold text-yellow-600">0</p></div>
<div class="bg-white p-4 rounded-xl border"><p class="text-xs text-gray-400">ACTIVE CARE</p><p id="active" class="text-2xl font-bold text-emerald-600">0</p></div>
</div>
<div class="mt-6 bg-white rounded-2xl border p-6">
<div class="flex justify-between items-center"><h2 class="font-bold">All Bookings - Live Control</h2><button onclick="loadBookings()" class="text-xs bg-gray-100 px-3 py-1 rounded-full">↻ Refresh</button></div>
<div id="bookingsList" class="mt-4 space-y-3"></div>
</div>
</div>
</div>
<script>
const ADMIN_PASS = 'kwaliver92';
function doLogin(){
 let p=document.getElementById('pass').value;
 if(p===ADMIN_PASS){localStorage.setItem('hch_admin','yes');showPanel();}
 else{document.getElementById('loginErr').textContent='Wrong password! Use kwaliver92';}
}
function showPanel(){
 document.getElementById('login').classList.add('hidden');
 document.getElementById('panel').classList.remove('hidden');
 loadBookings();
}
function loadBookings(){
 let arr=JSON.parse(localStorage.getItem('hch_bookings')||'[]');
 document.getElementById('total').textContent=arr.length;
 document.getElementById('onway').textContent=arr.filter(b=>b.status==='on_the_way').length;
 document.getElementById('active').textContent=arr.filter(b=>b.status==='care_started').length;
 let html='';
 if(arr.length===0) html='<p class="text-center text-gray-400 py-10">No bookings yet. Book on homepage to test.</p>';
 arr.forEach((b,i)=>{
  html+=`<div class="border p-4 rounded-xl flex flex-col md:flex-row md:justify-between gap-3">
  <div><p class="font-bold">${b.id} - ${b.name}</p><p class="text-xs text-gray-500">${b.phone} • ${b.service||'Home Care'} • ${b.eta||'30 min'} • Status: <b>${b.status}</b></p><p class="text-xs mt-1">Caregiver: ${b.caregiver||'Not assigned'}</p></div>
  <div class="flex flex-wrap gap-2">
  <select onchange="assignCaregiver('${b.id}',this.value)" class="text-xs border rounded-full px-3 py-1 bg-gray-50">
  <option>Assign Caregiver</option><option ${b.caregiver==='Grace N.'?'selected':''}>Grace N.</option><option ${b.caregiver==='Sarah K.'?'selected':''}>Sarah K.</option><option ${b.caregiver==='Moses O.'?'selected':''}>Moses O.</option>
  </select>
  <select onchange="changeStatus('${b.id}',this.value)" class="text-xs border rounded-full px-3 py-1 bg-black text-white">
  <option>Change Status</option><option value="booked">Booked</option><option value="on_the_way">On The Way</option><option value="arrived">Arrived</option><option value="care_started">Care Started</option><option value="completed">Completed</option>
  </select>
  <a href="https://wa.me/${b.phone?.replace(/[^0-9]/g,'')}?text=Hi%20${b.name}%2C%20your%20booking%20${b.id}%20is%20${b.status}.%20Caregiver%20${b.caregiver||''}%20is%20coming.%20ETA%20${b.eta}" target="_blank" class="text-xs bg-[#25D366] text-white px-3 py-1 rounded-full">WhatsApp Client</a>
  </div></div>`;
 });
 document.getElementById('bookingsList').innerHTML=html;
}
function assignCaregiver(id,name){
 let arr=JSON.parse(localStorage.getItem('hch_bookings')||'[]'); let b=arr.find(x=>x.id===id); if(b){b.caregiver=name; localStorage.setItem('hch_bookings',JSON.stringify(arr)); loadBookings();}
}
function changeStatus(id,status){
 let arr=JSON.parse(localStorage.getItem('hch_bookings')||'[]'); let b=arr.find(x=>x.id===id); if(b){b.status=status; localStorage.setItem('hch_bookings',JSON.stringify(arr)); localStorage.setItem('hch_tracking_'+id,JSON.stringify(b)); alert('Updated '+id+' to '+status); loadBookings();}
}
if(localStorage.getItem('hch_admin')) showPanel();
</script>
</body>
</html>
