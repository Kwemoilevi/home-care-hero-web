<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEO Dashboard - Private</title>
<script>
// ===== CEO PRIVACY GUARD - DO NOT REMOVE =====
if(localStorage.getItem("isCEO")!=="true"){
  alert("Private CEO area only! Please login.");
  window.location.href="admin-login.html";
}
if(Date.now() - parseInt(localStorage.getItem("ceoLoginTime")||0) > 3600000){
  localStorage.removeItem("isCEO");
  alert("Session expired, login again.");
  window.location.href="admin-login.html";
}
// ===== END GUARD =====
</script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;}
.header{display:flex;justify-content:space-between;align-items:center;}
.logout{background:#ff4444;color:#fff;padding:8px 15px;border:none;border-radius:5px;cursor:pointer;}
.card{background:#1a1a1a;padding:20px;border-radius:10px;margin:15px 0;}
</style>
</head>
<body>
<div class="header">
<h2>👨‍💼 CEO • Chairman CEO - PRIVATE</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>💰 Wallet: UGX 400</h3>
<p>Your 20% Earnings - Private</p>
</div>

<div class="card">

<p>Clients: Pan-Africa | Caregivers: Verified</p>
<button onclick="window.location.href='clients.html'">View Clients</button>
<button onclick="window.location.href='caregiver.html'">View Caregivers</button>
<button onclick="window.location.href='wallet.html'">Wallet Details</button>
<button onclick="window.location.href='tracker.html'">Live Tracker</button>
</div>

<script>
function logout(){
  localStorage.removeItem("isCEO");

}
</script>
</body>
</html>
