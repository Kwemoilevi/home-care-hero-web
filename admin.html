<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin REAL</title>
<style>body{margin:0;font:14px system-ui;background:#f1f5f9}header{background:#0f172a;color:#fff;padding:12px 14px;display:flex;justify-content:space-between} .c{background:#fff;margin:10px;padding:12px;border-radius:10px} .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px} .s{background:#fff;padding:10px;border-radius:10px;text-align:center} table{width:100%;border-collapse:collapse} td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px} .b{padding:6px 10px;border:0;border-radius:6px;font-weight:700} .blue{background:#2563eb;color:#fff} .red{background:#ef4444;color:#fff}</style></head>
<body>
<header><div>🏠 Admin REAL</div><div><a href="admin-live-map.html" style="color:#60a5fa">Map</a> <button class="b red" onclick="localStorage.clear();location.href='admin-login.html'">Logout</button></div></header>
<div class="g"><div class="s"><small>BOOKINGS</small><br><b id="tb">0</b></div><div class="s"><small>REVENUE</small><br><b>UGX <span id="rev">0</span></b></div></div>
<div class="c"><h3 style="margin:0 0 8px">REAL Bookings (shared)</h3><div id="list">Loading real data...</div></div>
<script>
const API='/api/bookings';
async function load(){
 try{
  const r=await fetch(API); const data=await r.json();
  document.getElementById('tb').innerText=data.length;
  document.getElementById('rev').innerText=(data.length*50000).toLocaleString();
  let h='<table><tr><th>Client</th><th>Service</th><th>Location</th><th>Action</th></tr>';
  if(data.length==0) h+='<tr><td colspan=4>No real bookings yet. Test booking.html</td></tr>';
  else data.slice().reverse().forEach(b=>{
    h+=`<tr><td><b>${b.name||''}</b><br><small>${b.phone||''}</small></td><td>${b.service||''}<br><small>${b.date||''}</small></td><td>${b.location||''}</td><td><button class="b blue" onclick="assign(${b.id})">Assign</button></td></tr>`;
  });
  h+='</table>'; document.getElementById('list').innerHTML=h;
 }catch(e){ document.getElementById('list').innerHTML='Error: '+e.message+'<br>Did you create KV Storage in Vercel?'; }
}
async function assign(id){ await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:'assigned'})}); alert('Assigned'); load(); }
load(); setInterval(load,5000);
</script></body></html>
