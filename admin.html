<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title>
<style>
body{margin:0;font:14px system-ui;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;margin:10px;padding:12px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.stat{background:#fff;padding:12px;border-radius:12px;text-align:center}
table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
.btn{padding:6px 10px;border:0;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px}
.blue{background:#2563eb;color:#fff} .green{background:#16a34a;color:#fff} .red{background:#ef4444;color:#fff} .gray{background:#e2e8f0}
input{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700} .pending{background:#fef3c7;color:#92400e} .assigned{background:#dbeafe;color:#1e40af} .paid{background:#dcfce7;color:#166534}
</style></head>
<body>
<header><div><b>🏠 Admin</b> <span id="dbStatus" style="opacity:.7;font-size:11px">LOCAL</span></div><div><a href="admin-live-map.html" style="color:#60a5fa;text-decoration:none;font-size:13px;margin-right:8px">Map</a><button class="btn red" onclick="logout()">Logout</button></div></header>
<div class="grid"><div class="stat"><small>TOTAL</small><br><b id="total">0</b></div><div class="stat"><small>REVENUE</small><br><b>UGX <span id="rev">0</span></b></div><div class="stat"><small>PENDING</small><br><b id="pending">0</b></div><div class="stat"><small>ONLINE</small><br><b id="online">0</b></div></div>
<div class="card">
<div style="display:flex;gap:8px;margin-bottom:10px"><input id="search" placeholder="Search name, phone, location..." oninput="render()"><button class="btn gray" onclick="load()">Refresh</button></div>
<div id="list">Loading...</div>
</div>
<script>
if(localStorage.getItem('adminLoggedIn')!=='true'){ location.href='admin-login.html'; }
function logout(){ localStorage.removeItem('adminLoggedIn'); location.href='admin-login.html'; }
let BOOKINGS=[];
async function load(){
 document.getElementById('list').innerHTML='Loading...';
 try{
  const r=await fetch('/api/bookings',{cache:'no-store'});
  if(r.ok){ const data=await r.json(); if(Array.isArray(data)){ BOOKINGS=data; document.getElementById('dbStatus').innerText='REAL API'; render(); return; } }
 }catch(e){}
 try{ BOOKINGS=JSON.parse(localStorage.getItem('bookings')||'[]'); }catch(e){ BOOKINGS=[]; }
 document.getElementById('dbStatus').innerText='LOCAL MODE';
 render();
}
function render(){
 const q=(document.getElementById('search').value||'').toLowerCase();
 const filtered=BOOKINGS.filter(b=> ((b.name||'')+(b.phone||'')+(b.location||'')).toLowerCase().includes(q));
 document.getElementById('total').innerText=BOOKINGS.length;
 document.getElementById('rev').innerText=(BOOKINGS.length*50000).toLocaleString();
 document.getElementById('pending').innerText=BOOKINGS.filter(b=>b.status==='pending').length;
 document.getElementById('online').innerText= localStorage.getItem('caregiverLocation')?'1':'0';
 let html='<table><tr><th>Client</th><th>Service</th><th>Status</th><th>Action</th></tr>';
 if(filtered.length===0) html+='<tr><td colspan=4>No bookings. Go to /booking.html</td></tr>';
 else filtered.slice().reverse().forEach(b=>{
  const badge=b.status==='assigned'?'<span class="badge assigned">ASSIGNED</span>':b.status==='paid'?'<span class="badge paid">PAID</span>':'<span class="badge pending">PENDING</span>';
  html+=`<tr><td><b>${b.name||''}</b><br><small>${b.phone||''}</small><br><small>${b.location||''}</small></td><td>${b.service||''}<br><small>${b.date||''}</small></td><td>${badge}</td><td><button class="btn blue" onclick="updateStatus(${b.id},'assigned')">Assign</button> <button class="btn green" onclick="updateStatus(${b.id},'paid')">Paid</button> <button class="btn red" onclick="del(${b.id})">X</button></td></tr>`;
 });
 html+='</table>';
 document.getElementById('list').innerHTML=html;
}
async function updateStatus(id,status){
 try{ await fetch('/api/bookings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})}); }catch(e){}
 BOOKINGS=BOOKINGS.map(b=> b.id==id?{...b,status}:b);
 localStorage.setItem('bookings',JSON.stringify(BOOKINGS));
 render();
}
async function del(id){ if(!confirm('Delete?')) return; BOOKINGS=BOOKINGS.filter(b=>b.id!=id); localStorage.setItem('bookings',JSON.stringify(BOOKINGS)); render(); }
load();
</script>
</body></html>
