<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO Admin | Home Care Hero</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:white;margin:0;padding:0}
.header{background:#1e293b;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#22c55e;font-size:20px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;background:#334155;cursor:pointer;font-size:13px;font-weight:600}
.tab.active{background:#22c55e;color:white}
.container{padding:15px;max-width:1200px;margin:0 auto}
.card{background:#1e293b;border-radius:16px;padding:16px;margin:10px 0;border:1px solid #334155}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#0f172a;padding:12px;border-radius:12px;text-align:center}
.stat h3{margin:0;color:#22c55e;font-size:22px}
.stat p{margin:5px 0 0;font-size:12px;color:#94a3b8}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #334155}
th{color:#94a3b8;font-size:11px;text-transform:uppercase}
.btn{padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:12px;margin:2px}
.btn-green{background:#22c55e;color:white}
.btn-red{background:#ef4444;color:white}
.btn-blue{background:#3b82f6;color:white}
.btn-gray{background:#475569;color:white}
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-pending{background:#f59e0b;color:white}
.badge-verified{background:#22c55e;color:white}
.badge-rejected{background:#ef4444;color:white}
input,select{padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white}
.section-title{font-size:16px;font-weight:800;margin:20px 0 10px;color:#e2e8f0}
a{color:#22c55e}
.small{font-size:11px;color:#94a3b8}
</style>
</head>
<body>

</div>
