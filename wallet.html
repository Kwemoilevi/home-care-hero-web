<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet BetPawa</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0e0e0e;color:#fff}.h{background:#1a1a1a;padding:14px;display:flex;justify-content:space-between;border-bottom:2px solid #22c55e}.balBox{background:linear-gradient(135deg,#1e293b,#0f172a);margin:12px;border-radius:16px;padding:18px;border:1px solid #22c55e}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px}.btn{padding:14px;border:none;border-radius:12px;font-weight:900;cursor:pointer}.g{background:#22c55e;color:#000}.w{background:#fff;color:#000}.r{background:#ef4444;color:#fff}.card{background:#1a1a1a;margin:12px;border-radius:12px;padding:14px}.input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#0e0e0e;color:#fff;margin:8px 0;font-size:16px}.m{flex:1;padding:12px;border-radius:10px;border:2px solid #333;text-align:center;cursor:pointer}.m.active{border-color:#22c55e;background:#1a2e1a}</style></head><body><div class="h"><b>💚 HERO WALLET<br><small style="color:#888">BetPawa Style</small></b><a href="dashboard.html" style="background:#333;color:#fff;padding:6px 12px;border-radius:8px;text-decoration:none">⬅️ Back</a></div><div class="balBox"><small style="color:#94a3b8">💰 AVAILABLE BALANCE</small><br><div style="display:flex;align-items:center;margin-top:6px"><b id="bal" style="font-size:32px">UGX 25,000</b><span id="eye" onclick="tog()" style="cursor:pointer;margin-left:10px;font-size:20px">👁️</span></div><small style="color:#22c55e">● Tap eye to hide like BetPawa</small></div><div class="grid2"><button class="btn g" onclick="showD()">⬆️ DEPOSIT</button><button class="btn w" onclick="showW()">⬇️ WITHDRAW</button></div><div class="card" id="dep"><h3>⬆️ Deposit MTN/Airtel</h3><div style="display:flex;gap:10px;margin:8px 0"><div class="m active" id="mtn" onclick="setM('MTN')"><b>📱 MTN MoMo</b></div><div class="m" id="air" onclick="setM('AIRTEL')"><b>📱 Airtel Money</b></div></div><input class="input" id="ph" placeholder="07XXXXXXXX"><input class="input" id="am" type="number" placeholder="Amount UGX min 1000"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0"><button class="btn" style="background:#333;color:#fff" onclick="q(5000)">5K</button><button class="btn" style="background:#333;color:#fff" onclick="q(10000)">10K</button><button class="btn" style="background:#333;color:#fff" onclick="q(20000)">20K</button></div><button class="btn g" style="width:100%" onclick="dep()">✅ DEPOSIT NOW</button></div><div class="card" id="with" style="display:none"><h3>⬇️ Withdraw</h3><input class="input" id="wam" type="number" placeholder="Amount to withdraw"><button class="btn r" style="width:100%" onclick="withD()">🏧 WITHDRAW</button><button class="btn" style="width:100%;margin-top:8px;background:#333;color:#fff" onclick="showD()">⬅️ Back</button></div><div class="card"><h3>📜 History</h3><div id="his"></div><button onclick="clr()" style="background:transparent;color:#ef4444;border:none;margin-top:8px">🗑️ Clear</button></div><script>let b=parseInt(localStorage.getItem('walletBal')||'25000');let h=JSON.parse(localStorage.getItem('walletHist')||'[]');let mm='MTN';let hd=false;function ren(){document.getElementById('bal').textContent=hd?'UGX •••••':'UGX '+b.toLocaleString();document.getElementById('eye').textContent=hd?'🙈':'👁️';let s='';if(h.length==0)s='<small style="color:#666">No transactions</small>';else h.slice().reverse().forEach(t=>{let c=t.type=='DEPOSIT'?'#22c55e':'#ef4444';s+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222"><div><b style="color:${c}">${t.type}</b><br><small style="color:#888">${t.date}</small></div><div style="text-align:right"><b>${t.type=='DEPOSIT'?'+':'-'} ${t.amount.toLocaleString()}</b><br><small>Bal:${t.bal.toLocaleString()}</small></div></div>`});document.getElementById('his').innerHTML=s;}function tog(){hd=!hd;ren();}function setM(m){mm=m;document.getElementById('mtn').className=m=='MTN'?'m active':'m';document.getElementById('air').className=m=='AIRTEL'?'m active':'m';}function q(a){document.getElementById('am').value=a;}function dep(){let a=parseInt(document.getElementById('am').value);let p=document.getElementById('ph').value;if(!a||a<1000){alert('Min 1000');return;}if(!p){alert('Enter phone');return;}b+=a;h.push({type:'DEPOSIT',amount:a,method:mm,bal:b,date:new Date().toLocaleString()});localStorage.setItem('walletBal',b);localStorage.setItem('walletHist',JSON.stringify(h));ren();alert('✅ DEPOSIT SUCCESS MTN '+mm+' UGX '+a.toLocaleString()+'\nNew Bal: '+b.toLocaleString());document.getElementById('am').value='';}function showW(){document.getElementById('dep').style.display='none';document.getElementById('with').style.display='block';}function showD(){document.getElementById('dep').style.display='block';document.getElementById('with').style.display='none';}function withD(){let a=parseInt(document.getElementById('wam').value);if(!a||a<=0){alert('Enter amount');return;}if(a>b){alert('Low balance UGX '+b.toLocaleString());return;}b-=a;h.push({type:'WITHDRAW',amount:a,bal:b,date:new Date().toLocaleString()});localStorage.setItem('walletBal',b);localStorage.setItem('walletHist',JSON.stringify(h));ren();alert('✅ WITHDRAW UGX '+a.toLocaleString()+' sent!\nNew Bal:'+b.toLocaleString());showD();}function clr(){if(confirm('Clear history?')){h=[];localStorage.setItem('walletHist','[]');ren();}}ren();</script></body></html>
