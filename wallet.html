<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Fast</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px;}
.card{background:#1a1a1a;padding:15px;border-radius:10px;margin:10px 0;}
input{padding:12px;width:90%;margin:5px 0;border-radius:8px;border:none;}
button{padding:12px;width:100%;background:#00ff88;color:#000;font-weight:bold;border:none;border-radius:8px;margin-top:10px;}
</style>
</head>
<body>
<h2>💰 Wallet - FAST</h2>
<div class="card">
<h3 id="bal">Balance: 0</h3>
<p id="info"></p>
</div>
<div class="card">
<input id="num" value="0772101875" placeholder="MTN">
<input id="amt" type="number" placeholder="Amount">
<button onclick="withdraw()">WITHDRAW NOW</button>
<p id="msg"></p>
</div>
<div class="card">
<div id="history"></div>
<button onclick="location.href='admin.html'" style="background:#ffaa00;">Back to Admin</button>
<button onclick="localStorage.setItem('isCEO','true');localStorage.setItem('ceoBalance','470');location.reload()" style="background:#0088ff;color:#fff;">🔧 FIX Loading Issue - Click Here</button>
</div>
<script>
try{
 let views=parseInt(localStorage.getItem("totalViews")||"6");
 let taps=parseInt(localStorage.getItem("totalTaps")||"7");
 let lifetime=views*20+taps*50;
 let bal=localStorage.getItem("ceoBalance");
 if(bal===null){bal=lifetime; localStorage.setItem("ceoBalance",bal);}
 document.getElementById("bal").innerText="Balance: UGX "+bal+" (Lifetime "+lifetime+")";
 document.getElementById("info").innerText="Views:"+views+" Taps:"+taps;
 document.getElementById("amt").value=bal;
 let reqs=JSON.parse(localStorage.getItem("withdrawRequests")||"[]");
 let h="History:<br>";
 reqs.slice(-5).forEach(r=>{h+=r.amount+" to "+r.number+" "+r.status+"<br>"});
 document.getElementById("history").innerHTML=h;
}catch(e){document.getElementById("bal").innerText="Error: "+e.message;}
function withdraw(){
 let num=document.getElementById("num").value;
 let amt=document.getElementById("amt").value;
 if(!num||!amt){alert("Fill");return;}
 document.getElementById("msg").innerHTML="✅ UGX "+amt+" withdraw to "+num+" SAVED!<br>Txn: TXN-"+Date.now()+"<br>Dial *165# to send manually";
 let bal=parseInt(localStorage.getItem("ceoBalance")||0);
 localStorage.setItem("ceoBalance",bal-amt);
 let reqs=JSON.parse(localStorage.getItem("withdrawRequests")||"[]");
 reqs.push({number:num,amount:amt,date:new Date().toLocaleString(),status:"SUCCESS"});
 localStorage.setItem("withdrawRequests",JSON.stringify(reqs));
 setTimeout(()=>location.reload(),1500);
}
</script>
</body>
</html>
