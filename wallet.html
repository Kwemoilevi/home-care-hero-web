<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caregiver Registration - Home Care Hero</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;}
.card{background:#1a1a1a;padding:20px;border-radius:12px;margin:15px 0;}
input,select{padding:12px;width:92%;border-radius:8px;border:none;margin:8px 0;}
button{padding:14px;width:100%;background:#00ff88;color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-top:10px;}
.badge{padding:5px 10px;border-radius:5px;font-size:12px;}
.pending{background:#ffaa00;color:#000;}
.verified{background:#00ff88;color:#000;}
.top{background:gold;color:#000;}
</style>
</head>
<body>
<h2>🧑‍⚕️ Join as Caregiver - Automatic</h2>

<div class="card" id="regForm">
<h3>Register in 30 Seconds</h3>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="MTN Number e.g. 076XXXXXXX" type="tel">
<select id="skill">
<option value="">Select Skill</option>
<option>Nurse</option>
<option>Midwife</option>
<option>Physiotherapist</option>
<option>Babysitter</option>
<option>Elderly Care</option>
</select>
<input id="district" placeholder="District e.g. Kampala">
<input id="experience" placeholder="Years Experience e.g. 3">
<button onclick="registerCaregiver()">REGISTER & GET VERIFIED</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>📋 Registered Caregivers (Auto-list)</h3>
<div id="list"></div>
</div>

<script>
function registerCaregiver(){
  let n=document.getElementById('name').value.trim();
  let p=document.getElementById('phone').value.trim();
  let s=document.getElementById('skill').value;
  let d=document.getElementById('district').value.trim();
  let e=document.getElementById('experience').value.trim();
  
  if(!n||!p||!s||!d){ alert("Fill all fields!"); return; }
  if(p.length<10){ alert("Valid MTN number!"); return; }
  
  let caregivers=JSON.parse(localStorage.getItem("caregivers")||"[]");
  
  // Check duplicate
  if(caregivers.find(c=>c.phone===p)){ 
    document.getElementById('msg').innerHTML="⚠️ You already registered! Wait for CEO verification.";
    return;
  }
  
  let newCare={
    id:Date.now(),
    name:n, phone:p, skill:s, district:d, experience:e,
    status:"PENDING", // CEO will verify to VERIFIED
    isTop:false,
    registeredAt:new Date().toLocaleString(),
    views:0
  };
  
  caregivers.push(newCare);
  localStorage.setItem("caregivers",JSON.stringify(caregivers));
  
  document.getElementById('msg').innerHTML="✅ Registered! CEO will verify you in 24hrs. You will appear on homepage after verification. <br><br>Want to be TOP NURSE? Pay 5K MTN: 076XXXXXXX for 7 days top placement!";
  document.getElementById('regForm').style.display="none";
  showList();
}

function showList(){
  let caregivers=JSON.parse(localStorage.getItem("caregivers")||"[]");
  let html="";
  if(caregivers.length===0){ html="No caregivers yet. Be first!"; }
  else{
    caregivers.slice(-10).reverse().forEach(c=>{
      html+=`<div style="border-bottom:1px solid #333;padding:10px 0;">
      <b>${c.name}</b> - ${c.skill} - ${c.district}
      <span class="badge ${c.status==='VERIFIED'?'verified':'pending'}">${c.status}</span>
      ${c.isTop?'<span class="badge top">⭐ TOP</span>':''}
      <br><small>${c.phone} | ${c.experience} yrs | ${c.registeredAt}</small>
      </div>`;
    });
  }
  document.getElementById('list').innerHTML=html;
}
showList();

// Auto-show TOP nurses on index page
if(caregivers=>{}){
}
</script>
</body>
</html>
