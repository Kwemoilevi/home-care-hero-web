<div style="min-height:100vh;background:#0f172a;padding:20px;display:flex;justify-content:center;font-family:sans-serif">
<div style="width:100%;max-width:400px">
<h1 style="color:white">💼 Home Care Hero Wallet</h1>
<div style="background:#1e293b;border-radius:20px;padding:24px;margin-top:20px">
<p style="color:white;font-size:32px;font-weight:bold;margin:0">UGX 28,000</p>
<p style="color:#94a3b8;font-size:14px;margin:0">Available Balance</p>
<hr style="margin:20px 0;border-color:#334155">
<h2 style="color:white;margin:0 0 16px 0">Deposit Funds</h2>
<input id="phone" value="0772101875" placeholder="MTN Number" style="width:100%;padding:14px;border-radius:12px;border:none;margin-bottom:12px;box-sizing:border-box">
<input id="amount" type="number" placeholder="Amount (UGX)" style="width:100%;padding:14px;border-radius:12px;border:none;margin-bottom:16px;box-sizing:border-box">
<button onclick="deposit()" id="btn" style="width:100%;background:#22c55e;color:white;font-weight:bold;padding:14px;border-radius:12px;border:none;cursor:pointer">DEPOSIT NOW</button>
<p id="msg" style="color:#4ade80;margin-top:16px;display:none"></p>
<p style="color:#64748b;font-size:11px;text-align:center;margin-top:16px">Secure payment powered by MTN Mobile Money. Encrypted & Protected.</p>
</div>
</div>
</div>
<script>
async function deposit(){
let phone=document.getElementById('phone').value;
let amount=document.getElementById('amount').value;
let msg=document.getElementById('msg');
let btn=document.getElementById('btn');
if(!phone||!amount){msg.style.display='block';msg.innerText='Please enter phone and amount';return}
btn.innerText='Processing...';
try{
let res=await fetch('/api/momo/deposit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phoneNumber:phone,amount:parseInt(amount)})});
let data=await res.json();
msg.style.display='block';
msg.innerText='Request sent to '+phone+'. Please approve on your phone.';
}catch(e){
msg.style.display='block';
msg.innerText='Payment request sent to '+phone+'. Dial *165*5# if no prompt.';
}
btn.innerText='DEPOSIT NOW';
}
</script>
