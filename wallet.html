<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet - Withdraw</title>
<script>
if(localStorage.getItem("isCEO")!=="true"){
  alert("Private CEO area!");
  window.location.href="admin-login.html";
}
</script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;}
.card{background:#1a1a1a;padding:20px;border-radius:12px;margin:15px 0;}
button{padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;}
.green{background:#00ff88;color:#000;}
.orange{background:#ffaa00;color:#000;}
input,select{padding:12px;width:95%;border-radius:8px;border:none;margin:10px 0;}
</style>
</head>
<body>
<h2>💰 CEO Wallet - Private</h2>

<div class="card">
<h3 id="balance">Balance: UGX 410</h3>
<p id="details">6 Views | 7 Taps | Today's Earnings</p>
</div>

<div class="card">
<h3>📤 Withdraw to Your Number</h3>
<input id="momoNumber" type="tel" placeholder="MTN Number e.g. 076XXXXXXX" value="076">
<select id="network">
<option value="MTN">MTN MoMo Uganda</option>
<option value="AIRTEL">Airtel Money Uganda</option>
</select>
<input id="amount" type="number" placeholder="Amount to withdraw" value="410">
<button class="green" onclick="withdraw()">WITHDRAW NOW</button>
<p id="msg"></p>
</div>

<div class="card">
<h4>How it works now (Manual):</h4>
<p>1. You click WITHDRAW → It saves request<br>
2. You receive MTN MoMo from your own business number<br>
3. Later we connect automatic MTN API</p>
<button class="orange" onclick="window.location.href='admin.html'">Back to CEO Dashboard</button>
</div>

<script>
// Load real balance from your site
let bal = localStorage.getItem("ceoBalance") || 410;
document.getElementById("balance").innerText = "Balance: UGX " + bal;
document.getElementById("amount").value = bal;

function withdraw(){
  let num = document.getElementById("momoNumber").value;
  let amt = document.getElementById("amount").value;
  let net = document.getElementById("network").value;
  
  if(num.length < 10){ alert("Enter valid MTN number!"); return; }
  if(amt < 500){ 
    document.getElementById("msg").innerHTML = "⚠️ Minimum withdraw is 500 UGX. You have "+bal+" UGX. Keep earning! You earn 20 UGX per sponsor view + 50 UGX per BOOK tap. Share your site more!";
    return; 
  }
  
  // Save withdraw request
  let requests = JSON.parse(localStorage.getItem("withdrawRequests")||"[]");
  requests.push({number:num, amount:amt, network:net, date:new Date().toLocaleString(), status:"PENDING"});
  localStorage.setItem("withdrawRequests", JSON.stringify(requests));
  
  document.getElementById("msg").innerHTML = "✅ Withdraw request for UGX "+amt+" to "+num+" ("+net+") SAVED!<br><br>Since you are CEO, send yourself MoMo from your business line:<br>Dial *165# → Send Money → Enter "+num+" → Amount "+amt+"<br><br>Your balance will reset to 0 after you confirm.";
  
  // For now, CEO self-pays. Reset balance
  // localStorage.setItem("ceoBalance",0);
}

// Auto-load balance from index page stats
setInterval(()=>{
  let views = localStorage.getItem("totalViews")||6;
  let taps = localStorage.getItem("totalTaps")||7;
  let calc = (views*20)+(taps*50);
  if(calc>0){
    document.getElementById("balance").innerText = "Balance: UGX "+calc;
  }
},1000);
</script>
</body>
</html>
