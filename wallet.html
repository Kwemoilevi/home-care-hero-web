<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wallet</title></head>
<body style="margin:0;background:#f8fafc;font-family:sans-serif;display:flex;justify-content:center;padding:12px;">
<div style="width:100%;max-width:400px;">
<div style="display:flex;justify-content:space-between;align-items:center;background:#0f172a;color:white;padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:11px;"><span id="who">💰 Wallet</span><button onclick="localStorage.removeItem('hch_role');localStorage.removeItem('hch_user');location.href='login.html'" style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:8px;font-weight:bold;">Logout</button></div><script>let u=localStorage.getItem('hch_user');try{u=JSON.parse(u).name||u}catch(e){}document.getElementById('who').innerText='👋 '+ (u||'CEO') +' • WALLET';if(!localStorage.getItem('hch_role')){location.href='login.html';}</script>
<div style="background:linear-gradient(135deg,#0f172a,#14532d);color:white;border-radius:24px;padding:22px;text-align:center;">
<p style="margin:0;color:#86efac;font-size:11px;letter-spacing:2px;">CEO WALLET • REAL MONEY</p>
<h1 id="bal" style="margin:12px 0 0 0;font-size:32px;font-weight:900;">UGX 0</h1>
<p id="cnt" style="margin:6px 0 0 0;color:#94a3b8;font-size:12px;">0 bookings • 7k each</p>
</div>
<div style="background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-top:12px;">
<label style="font-size:11px;font-weight:bold;">Your MTN MoMo Number</label>
<input id="momo" style="width:100%;padding:12px;border-radius:10px;border:1px solid #e2e8f0;margin-top:6px;box-sizing:border-box;" placeholder="07XXXXXXXX">
<button onclick="saveMomo()" style="width:100%;background:#22c55e;color:white;padding:12px;border-radius:10px;border:none;font-weight:bold;margin-top:8px;">Save MoMo Number</button>
<p id="momoMsg" style="font-size:11px;text-align:center;margin-top:8px;"></p>
</div>
<a href="index.html" style="display:block;text-align:center;color:#64748b;font-size:11px;margin-top:12px;text-decoration:none;">← Back Home</a>
</div>
<script>
function load(){document.getElementById('bal').innerText='UGX '+Number(localStorage.getItem('ceo_bal')||'0').toLocaleString();document.getElementById('cnt').innerText=(localStorage.getItem('ceo_cnt')||'0')+' bookings • 7k each';let m=localStorage.getItem('ceo_momo');if(m)document.getElementById('momo').value=m;}
function saveMomo(){let m=document.getElementById('momo').value.trim();if(!m){document.getElementById('momoMsg').innerHTML='<span style=color:red>Enter number</span>';return;}localStorage.setItem('ceo_momo',m);document.getElementById('momoMsg').innerHTML='<span style=color:green>✅ Saved: '+m+'</span>';}
load();
</script>
</body></html>
