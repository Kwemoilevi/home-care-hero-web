<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet - Home Care Hero</title>
<style>body{font-family:sans-serif;background:#0f172a;color:white;padding:20px} .card{background:#1e293b;padding:20px;border-radius:16px;margin-top:20px} input,button{width:100%;padding:14px;border-radius:10px;border:none;margin-top:10px;font-size:16px} button{background:#22c55e;color:white;font-weight:bold} .bal{font-size:32px;font-weight:bold}</style>
</head><body>
<h2>💰 Home Care Hero Wallet</h2>
<div class="card">
<div class="bal" id="bal">UGX 25,000</div>
<p>Balance • Tap eye to hide</p>
<hr>
<h3>Deposit (BetPawa Style)</h3>
<input id="phone" placeholder="MTN Phone 077...">
<input id="amount" type="number" placeholder="Amount 5000">
<button onclick="dep()">DEPOSIT NOW</button>
<p id="msg" style="margin-top:15px;color:#4ade80"></p>
<p style="font-size:12px;color:#94a3b8;margin-top:20px">DEMO TODAY: For ads, manual MoMo to 077... After paying, tap Deposit. Real MoMo auto prompt comes tomorrow after MTN keys.</p>
</div>
<script>
let bal=25000;
function dep(){
 const p=document.getElementById('phone').value;
 const a=parseInt(document.getElementById('amount').value);
 const m=document.getElementById('msg');
 if(!p||!a){m.innerText='Enter phone & amount';return}
 m.innerText='⏳ Sending MoMo prompt to '+p+'...';
 setTimeout(()=>{
   bal+=a;
   document.getElementById('bal').innerText='UGX '+bal.toLocaleString();
   m.innerText='✅ SUCCESS! UGX '+a+' added! MoMo prompt sent to '+p+'. Balance updated like BetPawa!';
 },2000);
}
</script>
</body></html>
