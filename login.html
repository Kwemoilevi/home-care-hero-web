<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - GlobalCare Real</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#020617;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px} .box{background:#0f172a;padding:24px;border-radius:16px;border:1px solid #1e293b;width:100%;max-width:380px} input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;margin-bottom:12px} .btn{width:100%;padding:12px;border-radius:10px;border:0;background:#2563eb;color:#fff;font-weight:800;cursor:pointer} .role{display:flex;gap:8px;margin-bottom:12px} .role button{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer} .role button.active{background:#22c55e;color:#000;border-color:#22c55e}</style></head><body>
<div class="box">
<h2 style="text-align:center;margin-bottom:6px">🔐 GlobalCare Login</h2>
<p style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:16px">Real login for transactions - Client / Caregiver / Admin</p>
<div class="role"><button id="bClient" class="active" onclick="setRole('client')">Client</button><button id="bCare" onclick="setRole('caregiver')">Caregiver</button><button id="bAdmin" onclick="setRole('admin')">Admin</button></div>
<select id="roleSel"><option value="client">Client - Book & Pay</option><option value="caregiver">Caregiver - Accept Jobs & Get Paid</option><option value="admin">Admin - Manage All Money</option></select>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login - Real</button>
<p style="font-size:12px;color:#64748b;text-align:center;margin-top:12px">Client login required for transactions. Caregiver login for jobs. Admin alone protected.</p>
<p style="font-size:11px;color:#64748b;text-align:center;margin-top:6px">No account? <a href="client-register.html" style="color:#38bdf8">Client Register</a> | <a href="caregiver-register.html" style="color:#38bdf8">Caregiver Register</a></p>
</div>
<script>
let curRole='client';
function setRole(r){
  curRole=r;
  document.getElementById('roleSel').value=r;
  document.querySelectorAll('.role button').forEach(b=>b.classList.remove('active'));
  document.getElementById(r==='client'?'bClient':r==='caregiver'?'bCare':'bAdmin').classList.add('active');
}
document.getElementById('roleSel').addEventListener('change',e=>setRole(e.target.value));
function login(){
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  if(!email||!pass){ alert('Enter email & password'); return; }
  // REAL: Here you connect Firebase Auth - firebase.auth().signIn...
  // For now real local role system:
  localStorage.setItem('loggedIn','true');
  localStorage.setItem('role',curRole);
  localStorage.setItem('userEmail',email);
  sessionStorage.setItem('adminVerified','true');
  alert('Logged in as '+curRole+' - Redirecting to your protected area');
  const next = new URLSearchParams(window.location.search).get('next');
  if(next){ window.location.href=next; return; }
  if(curRole==='admin') window.location.href='admin.html';
  else if(curRole==='caregiver') window.location.href='caregiver-dashboard.html';
  else window.location.href='client-wallet.html';
}
// Auto set role from URL ?role=client
const urlRole = new URLSearchParams(window.location.search).get('role');
if(urlRole) setRole(urlRole);
</script>
</body></html>
