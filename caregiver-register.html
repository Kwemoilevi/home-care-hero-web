<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Caregiver Registration</title>
<style>body{margin:0;font:14px system-ui;background:#f8fafc;padding:12px}.card{background:#fff;padding:14px;border-radius:12px;max-width:480px;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.08)}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;margin-top:4px}label{font-weight:700;font-size:12px;margin-top:10px;display:block}.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;color:#fff;background:#16a34a;margin-top:14px}.doc{border:1px dashed #94a3b8;border-radius:8px;padding:10px;margin-top:8px;background:#f1f5f9}.ok{display:none;background:#dcfce7;padding:10px;border-radius:8px;margin-top:10px;color:#166534;text-align:center;font-weight:700}</style></head>
<body><div class="card">
<h2 style="text-align:center;margin:0">🌍 Caregiver Registration</h2><p style="text-align:center;color:#64748b;margin:4px 0 12px">Work worldwide, get clients globally</p>
<label>Full Name *</label><input id="name" placeholder="Name">
<label>Phone with country code *</label><input id="phone" placeholder="+256, +1, +44...">
<label>Country *</label><select id="country"></select>
<label>City / Area *</label><input id="city" placeholder="Kampala, London, New York...">
<label>National ID / Passport No *</label><input id="nin" placeholder="NIN / Passport">
<label>Experience</label><select id="exp"><option>0-1 year</option><option>1-3 years</option><option>3-5 years</option><option>5+ years</option></select>
<label>Services</label><select id="service"><option>Elderly Care</option><option>Child Care</option><option>Postnatal</option><option>Disability</option><option>All Services</option></select>
<label>About You</label><textarea id="about" rows="3" placeholder="Skills..."></textarea>
<div class="doc"><b>📄 Upload Documents *</b><label>ID / Passport Photo</label><input type="file" id="idDoc" accept="image/*"><label>Certificate</label><input type="file" id="certDoc" accept="image/*,.pdf"><label>Recommendation / LC1 / Reference</label><input type="file" id="lcDoc" accept="image/*,.pdf"><div id="prev" style="font-size:12px;margin-top:6px"></div></div>
<label><input type="checkbox" id="agree" style="width:auto"> I confirm docs are real</label>
<button class="btn" onclick="reg()">✅ Submit Global Registration</button>
<div id="ok" class="ok">✅ Sent! Admin will verify. You can work worldwide.</div>
<p style="text-align:center;margin-top:10px"><a href="caregiver-dashboard.html">My Dashboard</a> | <a href="admin.html">Admin</a></p>
</div><script>
const C=[["UG","Uganda"],["KE","Kenya"],["TZ","Tanzania"],["RW","Rwanda"],["NG","Nigeria"],["ZA","South Africa"],["US","USA"],["GB","UK"],["CA","Canada"],["AU","Australia"],["AE","UAE"],["IN","India"],["Other","Other Country"]];
const sel=document.getElementById('country');C.forEach(c=>sel.innerHTML+=`<option value="${c[1]}">${c[1]}</option>`);
let docs={};function read(inp,key){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{docs[key]=e.target.result;document.getElementById('prev').innerHTML+=`<div>✅ ${key}: ${f.name}</div>`};r.readAsDataURL(f);}
document.getElementById('idDoc').addEventListener('change',function(){read(this,'ID')});document.getElementById('certDoc').addEventListener('change',function(){read(this,'Cert')});document.getElementById('lcDoc').addEventListener('change',function(){read(this,'Ref')});
function reg(){
 const n=document.getElementById('name').value.trim(),p=document.getElementById('phone').value.trim(),nin=document.getElementById('nin').value.trim(),city=document.getElementById('city').value.trim();
 if(!n||!p||!nin||!city){alert('Fill name, phone, NIN, city');return;}
 if(!document.getElementById('agree').checked){alert('Tick agree');return;}
 if(!docs['ID']){alert('Upload ID');return;}
 const cg={id:Date.now(),name:n,phone:p,nin:nin,country:sel.value,city:city,location:city+', '+sel.value,exp:document.getElementById('exp').value,service:document.getElementById('service').value,about:document.getElementById('about').value,docs:docs,status:'pending_verification',date:new Date().toLocaleDateString()};
 let L=JSON.parse(localStorage.getItem('caregivers')||'[]');L.push(cg);localStorage.setItem('caregivers',JSON.stringify(L));
 document.getElementById('ok').style.display='block';alert('Saved! Total: '+L.length);
}
</script></body></html>
