<!DOCTYPE html><html><head><title>Register Caregiver - Home Care Hero</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;padding:16px;max-width:500px;margin:auto;background:#f5f7fb}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;padding:14px;background:#0d6efd;color:#fff;border:none;border-radius:8px;font-size:16px}</style></head><body><div class="card"><h2>🧑‍⚕️ Become a Caregiver</h2><p>Home Care Hero Uganda - 0772101875</p><input id="name" placeholder="Full Name"><input id="phone" placeholder="Phone 07XX XXX XXX"><input id="location" placeholder="Location e.g. Ntinda, Kampala"><select id="skill"><option value="">Select Skill</option><option>Elderly Care</option><option>Baby Sitting / Nanny</option><option>Physiotherapy</option><option>Nursing Assistant</option><option>Disability Care</option></select><input id="experience" type="number" placeholder="Years Experience"><textarea id="bio" placeholder="Brief bio"></textarea><button id="btn" onclick="register()">Register Now</button><p id="msg"></p><a href="index.html">← Back to Home</a></div><script>const API="https://home-Care-hero-api.onrender.com";async function register(){const btn=document.getElementById('btn');const msg=document.getElementById('msg');btn.disabled=true;btn.textContent='Registering...';try{const res=await fetch(API+'/api/caregivers/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,phone:document.getElementById('phone').value,location:document.getElementById('location').value,skill:document.getElementById('skill').value,experience:document.getElementById('experience').value,bio:document.getElementById('bio').value})});const data=await res.json();if(data.success){msg.innerHTML='✅ '+data.msg;btn.textContent='Registered!';}else{msg.textContent='Failed';btn.disabled=false;}}catch(e){msg.textContent='Error: '+e.message;btn.disabled=false;btn.textContent='Register Now';}}</script></body></html>
