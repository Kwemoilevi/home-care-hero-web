<!DOCTYPE html><html><head><title>Register Caregiver - Home Care Hero</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;max-width:600px;margin:20px auto;padding:20px}input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold}</style></head><body><h2>Register Caregiver</h2><form id="f"><input id="name" placeholder="Full Name" required><input id="phone" placeholder="Phone 07..." required><input id="email" placeholder="Email"><input id="experience" placeholder="Years Experience" type="number"><select id="gender"><option>Male</option><option>Female</option></select><button type="submit">Register</button></form><p id="msg"></p><script>const API="https://home-care-hero-api-v2.onrender.com";document.getElementById("f").onsubmit=async(e)=>{e.preventDefault();const m=document.getElementById("msg");m.textContent="Sending...";try{const r=await fetch(API+"/api/caregivers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("name").value,phone:document.getElementById("phone").value,email:document.getElementById("email").value,experience:document.getElementById("experience").value,gender:document.getElementById("gender").value})});const d=await r.json();if(r.ok){m.textContent="✅ Registered! ID: "+(d.caregiver?.id||"");}else{m.textContent="❌ "+(d.error||"Failed")}}catch(err){m.textContent="❌ Error: "+err.message+" (Check DNS: set Private DNS to dns.google)"}};</script></body></html>
