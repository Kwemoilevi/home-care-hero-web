<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Global</title>
<script src="auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f3f6fb;color:#0f172a}
header{background:#0b1220;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-size:13px;margin-left:12px}
.wrap{padding:14px}
.card{max-width:620px;margin:0 auto;background:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 8px 30px rgba(15,23,42,.06);border:1px solid #e8eef8}
h2{text-align:center;font-size:18px}
.sub{text-align:center;color:#6b7a90;font-size:13px;margin:6px 0 18px 0}
label{font-size:13px;font-weight:700;margin-top:10px;display:block}
input,select,textarea{width:100%;padding:12px 12px;border-radius:10px;border:1.2px solid #cbd5e1;margin-top:6px;font-size:14px;background:#fff;outline:none}
select{background:#f8fafc}
.curr{border:2px solid #2563eb;border-radius:12px;padding:12px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.note{font-size:11px;color:#64748b;margin:6px 0 12px 2px}
.btn{width:100%;background:#2563eb;color:#fff;padding:14px;border-radius:12px;border:0;font-weight:800;font-size:14px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:8px">🌍 <b>GlobalCare</b></div>
<div><a href="index.html">Home</a> <a href="admin.html">Admin</a></div>
</header>

<div class="wrap">
<div class="card">
<h2>🌍 Book Caregiver</h2>
<div class="sub">Auto currency • Saves to server</div>

<label>Name *</label>
<input id="name" type="text">

<label>Phone *</label>
<input id="phone" placeholder="+256 / +1...">

<label>🌍 Country (auto)</label>
<select id="country">
<option>🇺🇬 Uganda - UGX 50000</option>
<option>🇰🇪 Kenya - KES 3500</option>
<option>🇹🇿 Tanzania - TZS 110000</option>
<option>🇺🇸 USA - USD 50</option>
<option>🇬🇧 UK - GBP 40</option>
<option>🇦🇪 UAE - AED 180</option>
</select>

<label>City *</label>
<input id="city" placeholder="Kampala, London, New York">

<label>Area *</label>
<input id="area" type="text">

<div style="margin-top:12px">
<div class="curr">
<div style="display:flex;align-items:center;gap:8px"><span>🇺🇬</span> <b>UGX</b> <span style="color:#64748b;font-size:12px">▼</span></div>
<div style="display:flex;align-items:center;gap:10px"><span>→</span> <b>50000</b></div>
</div>
<div class="note">Uganda → UGX 50000</div>
</div>

<label>Service *</label>
<select id="service">
<option>Elderly Care</option>
<option>Post-Surgery Care</option>
<option>Disability Support</option>
<option>Child Care</option>
<option>Housekeeping</option>
</select>

<label>Date *</label>
<select id="date">
<option value="">Select date</option>
<option>Today</option>
<option>Tomorrow</option>
</select>

<label>Details</label>
<textarea id="details" rows="3"></textarea>

<button class="btn" onclick="doBook()">✅ Book Now - UGX 50000</button>
</div>
</div>

<script>
function doBook(){
  const name=document.getElementById('name').value;
  const phone=document.getElementById('phone').value;
  const city=document.getElementById('city').value;
  const area=document.getElementById('area').value;
  if(!name||!phone||!city||!area){alert('Fill Name, Phone, City, Area');return;}
  // KEEP YOUR EXISTING SAVE LOGIC HERE - DO NOT CHANGE
  // Example: fetch('/api/bookings', {method:'POST', body:JSON.stringify({name,phone,city,area})})
  alert('Booking saved! Check Admin');
  window.location.href='client-wallet.html';
}
</script>
</body>
</html>
