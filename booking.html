<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Care</title>
<style>body{margin:0;font:14px system-ui;background:#f8fafc;padding:16px} .card{background:#fff;padding:16px;border-radius:12px;max-width:400px;margin:0 auto} input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} button{width:100%;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-weight:700}</style></head>
<body>
<div class="card">
<h3>📅 Book Home Care</h3><p style="font-size:12px;color:#64748b">UGX 50,000 per visit - MTN MoMo</p>
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone e.g. 0770000000">
<select id="service"><option>Nursing Care</option><option>Baby Care</option><option>Physiotherapy</option><option>Elderly Care</option></select>
<input id="location" placeholder="Location e.g. Kiwatule, Kampala">
<input id="date" type="date">
<textarea id="notes" placeholder="Notes"></textarea>
<button onclick="book()" id="btn">Book Now - UGX 50k</button>
<p id="msg" style="font-size:13px"></p>
<a href="index.html">← Home</a> | <a href="admin-login.html">Admin</a>
</div>
<script>
async function book(){
 const data={name:document.getElementById('name').value,phone:document.getElementById('phone').value,service:document.getElementById('service').value,location:document.getElementById('location').value,date:document.getElementById('date').value,notes:document.getElementById('notes').value};
 if(!data.name||!data.phone||!data.location){ document.getElementById('msg').innerText='Fill name, phone, location'; return; }
 document.getElementById('btn').innerText='Booking...';
 try{ await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); }catch(e){}
 let bookings=[]; try{ bookings=JSON.parse(localStorage.getItem('bookings')||'[]'); }catch(e){} data.id=Date.now(); data.status='pending'; bookings.push(data); localStorage.setItem('bookings',JSON.stringify(bookings));
 document.getElementById('msg').innerText='✅ Booked! Admin will call you. Reference #'+data.id;
 document.getElementById('btn').innerText='Booked';
}
</script>
</body></html>
