<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Home Care Booking</title>
<style>body{margin:0;font:14px system-ui;background:#f8fafc;padding:12px} .card{background:#fff;padding:14px;border-radius:12px;max-width:520px;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.08)} input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;margin-top:4px} label{font-weight:700;font-size:12px;margin-top:10px;display:block} .btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;color:#fff;background:#2563eb;margin-top:14px;cursor:pointer} .ok{display:none;background:#dcfce7;padding:10px;border-radius:8px;margin-top:10px;color:#166534;text-align:center;font-weight:700}</style></head>
<body>
<div class="card">
<h2 style="text-align:center;margin:0">🌍 Global Home Care</h2><p style="text-align:center;color:#64748b;margin:4px 0 12px">Book a caregiver anywhere in the world</p>

<label>Your Name *</label><input id="name" placeholder="Full name">
<label>Phone / WhatsApp *</label><input id="phone" placeholder="+256, +1, +44...">

<label>Country *</label><select id="country" onchange="updateCurrency()"></select>

<label>City / State *</label><input id="city" placeholder="e.g. Kampala, Nairobi, London, New York">

<label>Full Address / Area *</label><input id="location" placeholder="Street, Village, Landmark">

<label>Service *</label><select id="service"><option>Elderly Care</option><option>Child Care</option><option>Postnatal Care</option><option>Disability Support</option><option>House Help / Maid</option><option>Nursing Care</option></select>

<label>Date Needed *</label><input id="date" type="date">

<label>Currency / Price</label><div style="display:flex;gap:8px"><select id="currency" style="flex:1"></select><input id="price" style="flex:1" value="50000" readonly></div>
<small id="priceNote" style="color:#64748b">Price auto-adjusts by country</small>

<label>Details</label><textarea id="details" rows="3" placeholder="Describe needs..."></textarea>

<button class="btn" onclick="book()">✅ Book Caregiver Now</button>
<div id="ok" class="ok">✅ Booking Sent! We will assign a verified caregiver in your area.</div>
<p style="text-align:center;margin-top:10px"><a href="index.html">Home</a> | <a href="admin.html">Admin</a></p>
</div>

<script>
const countries=[
["UG","Uganda","UGX",50000],["KE","Kenya","KES",3500],["TZ","Tanzania","TZS",80000],["RW","Rwanda","RWF",35000],["US","USA","USD",50],["GB","UK","GBP",40],["CA","Canada","CAD",65],["AU","Australia","AUD",75],["NG","Nigeria","NGN",30000],["ZA","South Africa","ZAR",600],["AE","UAE","AED",180],["IN","India","INR",2500]
];
const sel=document.getElementById('country'); const cur=document.getElementById('currency');
countries.forEach(c=>{ sel.innerHTML+=`<option value="${c[0]}" data-cur="${c[2]}" data-price="${c[3]}">${c[1]} (${c[0]})</option>`; cur.innerHTML+=`<option value="${c[2]}">${c[2]}</option>`; });
function updateCurrency(){
 const opt=sel.options[sel.selectedIndex];
 document.getElementById('currency').value=opt.dataset.cur;
 document.getElementById('price').value=opt.dataset.price;
 document.getElementById('priceNote').innerText=`Price in ${opt.dataset.cur}: ${opt.dataset.price} for ${opt.text}`;
}
updateCurrency();
sel.value="UG"; // default your location
function book(){
 const name=document.getElementById('name').value.trim(); const phone=document.getElementById('phone').value.trim();
 const country=sel.options[sel.selectedIndex].text; const city=document.getElementById('city').value.trim();
 const loc=document.getElementById('location').value.trim(); const date=document.getElementById('date').value;
 if(!name||!phone||!city||!loc||!date){ alert('Fill all * fields'); return; }
 const b={id:Date.now(), name, phone, country, city, location:city+', '+loc+' ('+country+')', service:document.getElementById('service').value, date, currency:document.getElementById('currency').value, price:document.getElementById('price').value, details:document.getElementById('details').value, status:'pending', created:new Date().toISOString()};
 let list=JSON.parse(localStorage.getItem('bookings')||'[]'); list.push(b); localStorage.setItem('bookings',JSON.stringify(list));
 document.getElementById('ok').style.display='block'; document.getElementById('ok').innerText=`✅ Booked in ${city}, ${country}! ${b.currency} ${b.price} - Admin will assign caregiver.`;
 setTimeout(()=>{ document.getElementById('name').value=''; },500);
}
</script>
</body></html>
