<label>Price (auto by country)</label><div style="display:flex;gap:8px"><select id="curr" style="flex:1"></select><input id="price" style="flex:1" readonly></div>
<small id="note" style="color:#64748b"></small>
<label>Details</label><textarea id="details" rows="3" placeholder="Needs..."></textarea>
<button class="btn" onclick="book()">✅ Book Now</button>
<div id="ok" class="ok"></div>
<p style="text-align:center;margin-top:10px"><a href="admin.html">Admin</a> | <a href="caregiver-register.html">Join as Caregiver</a></p>
