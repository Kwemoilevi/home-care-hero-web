<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Care - Worldwide</title>
<style>body{margin:0;font:14px system-ui;background:#f8fafc;padding:16px} .card{background:#fff;padding:16px;border-radius:12px;max-width:400px;margin:0 auto} input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} button{width:100%;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-weight:700}</style></head>
<body>
<div class="card">
<h3>📅 Book Home Care - Worldwide</h3><p style="font-size:12px;color:#64748b">Trusted Nurses, Nannies, House Helps & Cooks - Worldwide. Book in 1 minute, wherever you are.</p>
<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone / WhatsApp e.g. +256 700 000 000">
<select id="service"><option>Nursing Care</option><option>Baby Care</option><option>Physiotherapy</option><option>Elderly Care</option><option>House Help</option><option>Cook</option></select>
<label>Country</label>
<select id="country">
<option>Uganda</option><option>Kenya</option><option>Tanzania</option><option>Rwanda</option><option>Nigeria</option><option>Ghana</option><option>South Africa</option><option>UK</option><option>USA</option><option>Canada</option><option>UAE</option><option>India</option><option>Other</option>
</select>
<label>City / Location</label>
<input id="location" placeholder="e.g. Kampala, Nairobi, London, New York">
<input id="date" type="date">
<textarea id="notes" placeholder="Notes"></textarea>
<button onclick="book()" id="btn">Book Now</button>

<!-- GLOBAL PAYMENT - PESAPAL FOR AFRICA, CARD FOR REST OF WORLD -->
<a href="https://store.pesapal.com/shop/72vf28-homecarehero" target="_blank" style="display:block;text-align:center;background:#e4002b;color:white;padding:12px;border-radius:8px;font-weight:700;text-decoration:none;margin-top:10px">💳 Pay - MTN / Airtel / Visa / Mastercard</a>
<p style="font-size:11px;color:#64748b;text-align:center;margin:6px 0 0">Step 1: Book above. Step 2: Tap Pay to pay securely.</p>

<p id="msg" style="font-size:13px"></p>
<a href="index.html">← Home</a> | <a href="admin-login.html">Admin</a>
</div>
<script>
async function book(){
 const c=document.getElementById('country').value;
 const data={name:document.getElementById('name').value,phone:document.getElementById('phone').value,service:document.getElementById('service').value,location:document.getElementById('location').value + ', ' + c,country:c,date:document.getElementById('date').value,notes:document.getElementById('notes').value};
 if(!data.name||!data.phone||!document.getElementById('location').value){ document.getElementById('msg').innerText='Fill name, phone, location'; return; }
 document.getElementById('btn').innerText='Booking...';
 try{ await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); }catch(e){}
 let bookings=[]; try{ bookings=JSON.parse(localStorage.getItem('bookings')||'[]'); }catch(e){} data.id=Date.now(); data.status='pending'; bookings.push(data); localStorage.setItem('bookings',JSON.stringify(bookings));
 document.getElementById('msg').innerText='✅ Booked! Admin will call you. Reference #'+data.id;
 document.getElementById('btn').innerText='Booked';
}
</script>
</body></html>
