<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS Live Tracker REAL</title>
<style>body{margin:0;font:14px system-ui;background:#f1f5f9}header{background:#0f172a;color:#fff;padding:10px;display:flex;justify-content:space-between} .card{background:#fff;margin:10px;padding:12px;border-radius:12px} #map{width:100%;height:320px;background:#e2e8f0;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#64748b;font-weight:700} .btn{padding:10px 14px;border:0;border-radius:8px;font-weight:800;cursor:pointer;color:#fff}.blue{background:#2563eb}.green{background:#16a34a}.red{background:#ef4444}</style>
</head><body>
<header><div><b>📍 GPS Live REAL</b> <small id="status">OFF</small></div><div><a href="admin.html" style="color:#60a5fa">Admin</a></div></header>

<div class="card">
<h3 style="margin:0">👩‍⚕️ Caregiver: Share Live Location</h3>
<p style="color:#64748b;margin:6px 0">Tap Start → your GPS goes live to Admin + Client</p>
<label>Booking ID / Caregiver Name</label><input id="cid" placeholder="e.g. 1234 or Mary">
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn green" onclick="startGPS()">▶️ Start GPS</button>
<button class="btn red" onclick="stopGPS()">⏹ Stop</button>
<button class="btn blue" onclick="viewLive()">👁 View Live</button>
</div>
<div style="margin-top:10px"><b>Status:</b> <span id="log">Ready</span><br><b>Coords:</b> <span id="coords">-</span></div>
</div>

<div class="card">
<h3 style="margin:0">🗺️ Live Map</h3>
<div id="map">No GPS yet - Start tracking</div>
<div style="margin-top:8px"><small id="mapLink"></small></div>
</div>

<div class="card">
<h3 style="margin:0">📍 All Live Trackers (Admin View)</h3>
<div id="allTracks">Loading...</div>
</div>

<script>
let watchId=null;
let API='/api/tracker';
if(!localStorage.getItem('tracker_api')) localStorage.setItem('tracker_api',JSON.stringify([]));

function log(m){document.getElementById('log').innerText=m;}
function startGPS(){
 const name=document.getElementById('cid').value.trim();
 if(!name){alert('Enter Booking ID or Caregiver Name');return;}
 if(!navigator.geolocation){alert('GPS not supported');return;}
 document.getElementById('status').innerText='LIVE...';log('Getting GPS...');
 watchId=navigator.geolocation.watchPosition(async pos=>{
  const {latitude,longitude}=pos.coords;
  document.getElementById('coords').innerText=`${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
  document.getElementById('map').innerHTML=`📍 LIVE<br>${latitude.toFixed(5)}, ${longitude.toFixed(5)}<br><a href="https://maps.google.com/?q=${latitude},${longitude}" target="_blank" style="color:#2563eb">Open Google Maps</a>`;
  document.getElementById('mapLink').innerHTML=`<a href="https://maps.google.com/?q=${latitude},${longitude}" target="_blank">📍 Open in Google Maps: ${latitude}, ${longitude}</a>`;
  // save REAL
  const payload={id:name,name:name,lat:latitude,lng:longitude,time:new Date().toISOString()};
  try{
   await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  }catch(e){}
  // fallback local
  let all=JSON.parse(localStorage.getItem('live_gps')||'[]');
  all=all.filter(x=>x.id!==name);all.push(payload);
  localStorage.setItem('live_gps',JSON.stringify(all));
  log(`Live @ ${new Date().toLocaleTimeString()}`);
 },err=>{log('GPS Error: '+err.message);},{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}

function stopGPS(){
 if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;document.getElementById('status').innerText='OFF';log('Stopped');}
}

async function viewLive(){
 let data=[];
 try{const r=await fetch(API);if(r.ok) data=await r.json();}catch(e){}
 if(data.length===0) data=JSON.parse(localStorage.getItem('live_gps')||'[]');
 let h='<table style="width:100%;border-collapse:collapse"><tr><th>Caregiver/ID</th><th>Location</th><th>Time</th></tr>';
 if(data.length===0) h+='<tr><td colspan=3>No live trackers</td></tr>';
 else data.slice().reverse().forEach(t=>{h+=`<tr><td><b>${t.name}</b><br><small>${t.id}</small></td><td><a href="https://maps.google.com/?q=${t.lat},${t.lng}" target="_blank">${t.lat.toFixed(5)}, ${t.lng.toFixed(5)} 📍</a></td><td><small>${new Date(t.time).toLocaleString()}</small><br><button class="btn blue" style="padding:4px 8px;font-size:11px" onclick="window.open('https://maps.google.com/?q=${t.lat},${t.lng}','_blank')">Map</button></td></tr>`;});
 h+='</table>';document.getElementById('allTracks').innerHTML=h;
}
setInterval(viewLive,5000);
viewLive();
</script>
</body></html>
