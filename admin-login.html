<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - HomeCare Hero</title>
<style>body{font-family:system-ui;background:#0f172a;display:flex;height:100vh;align-items:center;justify-content:center} .box{background:white;padding:32px;border-radius:16px;width:90%;max-width:400px} input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px} button{width:100%;padding:12px;background:#0f172a;color:white;border-radius:8px;font-weight:bold}</style>
</head><body>
<div class="box">
<h2>CEO / Admin Login</h2>
<form id="loginForm">
<input id="username" placeholder="Username" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p style="font-size:12px;color:gray;margin-top:10px">Default: admin / HomeCare2024!</p>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',(e)=>{
 e.preventDefault();
 const u=document.getElementById('username').value;
 const p=document.getElementById('password').value;
 if(u==='admin' && p==='HomeCare2024!'){
  localStorage.setItem('adminLoggedIn','true');
  window.location.href='admin.html';
 } else { alert('Wrong credentials'); }
});
</script>
</body></html>
