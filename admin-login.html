<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - Home Care Hero</title>
<style>
body{margin:0;font:15px system-ui;background:#f1f5f9;display:flex;justify-content:center;padding:20px}
.card{background:#fff;padding:22px;border-radius:14px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h2{margin:0} p{color:#666;font-size:13px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
#msg{color:#ef4444;font-size:14px}
a{color:#0f172a}
</style></head>
<body>
<div class="card">
<h2>🔐 Admin Login - REAL</h2>
<p>Home Care Hero - Only Admin. No fake balance.</p>
<input id="u" placeholder="Username" autocomplete="username">
<input id="p" type="password" placeholder="Password" autocomplete="current-password">
<button onclick="login()">Login</button>
<p id="msg"></p>
<a href="index.html">← Back to App</a>
</div>
<script>
function login(){
let u=document.getElementById('u').value.trim();
let p=document.getElementById('p').value.trim();
// ===== CHANGE YOUR LOGIN HERE ONLY =====
let MY_USER='admin';
let MY_PASS='HeroAdmin2026!';
// =======================================
if(u===MY_USER && p===MY_PASS){
localStorage.setItem('adminLoggedIn','true');
location.href='admin.html';
}else{
document.getElementById('msg').innerText='Wrong username or password';
}
}
// Enter key also logs in
document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter') login();});
</script>
</body></html>
