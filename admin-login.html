<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<style>body{margin:0;font:14px system-ui;background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh} .box{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:320px} input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} button{width:100%;padding:10px;background:#0f172a;color:#fff;border:0;border-radius:8px;font-weight:700}</style></head>
<body>
<div class="box">
<h3 style="margin:0 0 10px">Admin Login</h3>
<p style="font-size:12px;color:#64748b">admin / HomeCare2024!</p>
<input id="u" placeholder="Username" value="admin">
<input id="p" type="password" placeholder="Password" value="HomeCare2024!">
<button onclick="login()">Login</button>
<p id="msg" style="color:red;font-size:12px"></p>
</div>
<script>
function login(){
 if(document.getElementById('u').value==='admin' && document.getElementById('p').value==='HomeCare2024!'){
  localStorage.setItem('adminLoggedIn','true');
  location.href='admin.html';
 }else{
  document.getElementById('msg').innerText='Wrong username or password';
 }
}
</script>
</body></html>
