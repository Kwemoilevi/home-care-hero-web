<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - Home Care Hero</title><style>body{margin:0;font:15px system-ui;background:#f1f5f9;display:flex;justify-content:center;padding:20px}.card{background:#fff;padding:20px;border-radius:12px;width:100%;max-width:380px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-weight:700}</style></head>
<body><div class="card"><h2>🔐 Admin Login - REAL</h2><p style="color:#666;font-size:13px">Login to see REAL Firebase bookings & wallet requests. No fake balance.</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p><a href="index.html">← Back to App</a></div>

</script></body></html>
