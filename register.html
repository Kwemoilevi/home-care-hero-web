<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Caregiver</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f7fb;padding:14px}.card{background:#fff;max-width:420px;margin:0 auto;padding:18px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.1)}input,select{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:8px;margin:5px 0}.btn{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:8px;cursor:pointer}</style></head><body>
<div class="card"><h2>👩‍⚕️ Register Caregiver GLOBAL</h2><input id="name" placeholder="Full Name *"><select id="service"><option>Elderly Care</option><option>Child Care</option><option>Nursing</option><option>House Help</option><option>Live-in Care</option></select><input id="phone" placeholder="Phone + country code *"><input id="location" placeholder="City"><select id="country"><option>Uganda</option><option>USA</option><option>UK</option><option>Kenya</option><option>UAE</option><option>Canada</option><option>Other</option></select><button class="btn" onclick="register()">✅ Register</button><p id="ok" style="display:none;background:#dcfce7;padding:10px;border-radius:8px;margin-top:10px;text-align:center">✅ Registered! <a href="index.html">Go Home</a></p><p style="text-align:center;margin-top:10px"><a href="index.html">← Home</a></p></div>
<script>const API="https://home-care-hero-api.onrender.com";function register(){const c={name:document.getElementById('name').value,service:document.getElementById('service').value,phone:document.getElementById('phone').value,location:document.getElementById('location').value,country:document.getElementById('country').value};if(!c.name||!c.phone)return alert('Enter name & phone');let cs=JSON.parse(localStorage.getItem('caregivers')||'[]');cs.unshift(c);localStorage.setItem('caregivers',JSON.stringify(cs));try{fetch(API+'/caregivers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)})}catch{}document.getElementById('ok').style.display='block';}</script></body></html>
