<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Client Dashboard</title></head>
<body style="margin:0;background:#0f172a;font-family:sans-serif;display:flex;justify-content:center;padding:20px;">
<div style="width:100%;max-width:420px;">
<h1 style="color:white;">👨‍👩‍👧 Client Dashboard</h1>
<p style="color:#94a3b8;font-size:13px;">Find trusted caregivers in Kampala</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;">
<div style="background:#1e293b;padding:16px;border-radius:16px;"><p style="color:#94a3b8;font-size:11px;margin:0;">BALANCE</p><p style="color:white;font-weight:bold;margin:0;">UGX 28,000</p></div>
<div style="background:#1e293b;padding:16px;border-radius:16px;"><p style="color:#94a3b8;font-size:11px;margin:0;">BOOKINGS</p><p style="color:white;font-weight:bold;margin:0;">2 Active</p></div>
</div>
<div style="background:#1e293b;border-radius:20px;padding:20px;margin-top:20px;">
<h2 style="color:white;margin:0 0 12px 0;font-size:16px;">Book a Caregiver</h2>
<select style="width:100%;padding:12px;border-radius:12px;margin-bottom:10px;"><option>Elderly Care - 30k/day</option><option>Child Care - 25k/day</option><option>Nursing - 50k/day</option></select>
<input placeholder="Location e.g. Ntinda" style="width:100%;padding:12px;border-radius:12px;margin-bottom:12px;box-sizing:border-box;">
<button style="width:100%;background:#22c55e;color:white;font-weight:bold;padding:12px;border-radius:12px;border:none;">FIND CAREGIVERS</button>
</div>
<div style="background:#1e293b;border-radius:20px;padding:20px;margin-top:16px;">
<h2 style="color:white;margin:0 0 12px 0;">My Bookings</h2>
<div style="background:#334155;padding:12px;border-radius:12px;display:flex;justify-content:space-between;"><div><p style="color:white;font-size:13px;font-weight:bold;margin:0;">Grace N. - Elderly Care</p><p style="color:#94a3b8;font-size:11px;margin:0;">Today 9AM-5PM • UGX 30k</p></div><span style="color:#4ade80;font-size:11px;">● Active</span></div>
</div>
</div>
</body>
</html>
