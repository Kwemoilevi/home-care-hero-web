<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard - GLOBAL</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f7fb;padding:14px}.header{background:#0f172a;color:#fff;padding:16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}.stat{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}.stat b{font-size:22px;display:block}.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px}.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;margin:2px}.item{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap} a{color:#fff;text-decoration:none}</style></head><body>
<div class="header"><div><b>🌍 Home Care Hero - ADMIN DASHBOARD GLOBAL</b><br><small style="opacity:.7">Worldwide Control Panel</small></div><div style="display:flex;gap:6px;flex-wrap:wrap"><a href="index.html" style="background:#2563eb;padding:8px 10px;border-radius:8px">🏠 Homepage</a><a href="caregiver.html" style="background:#334155;padding:8px 10px;border-radius:8px">👩‍⚕️ Caregivers</a><a href="client.html" style="background:#22c55e;padding:8px 10px;border-radius:8px">👥 Clients</a></div></div>

<div class="stats">
<div class="stat"><b id="totalCaregivers">0</b><small>🌍 Caregivers Worldwide</small></div>
<div class="stat"><b id="totalClients">0</b><small>👥 Total Bookings</small></div>
<div class="stat"><b id="pending">0</b><small>⏳ Pending</small></div>
<div class="stat"><b id="active">0</b><small>✅ Active</small></div>
</div>

<div class="card"><h3>🌍 Caregivers by Country</h3><div id="countryStats"></div></div>

<div class="card"><h3>📋 Recent Bookings Worldwide</h3><div id="bookingsList"></div><button class="btn" style="background:#e2e8f0;color:#000;width:100%;margin-top:8px" onclick="clearBookings()">Clear All Bookings</button></div>

<div class="card"><h3>👩‍⚕️ All Caregivers - Global</h3><div id="caregiversList"></div><button class="btn" style="background:#e2e8f0;color:#000;width:100%;margin-top:8px" onclick="clearCaregivers()">Reset to 3 Global Samples</button></div>

<script>
const API="https://home-care-hero-api.onrender.com";
let caregivers=JSON.parse(localStorage.getItem('caregivers')||'[]');
if(!caregivers.length){caregivers=[{name:'Sample Caregiver - Sarah',service:'Elderly Care',phone:'+256772101875',location:'Kampala',country:'Uganda'},{name:'Emily Johnson',service:'Child Care',phone:'+1 212 555 0100',location:'New York',country:'USA'},{name:'Grace Atim',service:'Nursing',phone:'+44 20 7123 4567',location:'London',country:'UK'}]; localStorage.setItem('caregivers',JSON.stringify(caregivers));}
let bookings=JSON.parse(localStorage.getItem('bookings')||'[]');

function render(){
 document.getElementById('totalCaregivers').textContent=caregivers.length;
 document.getElementById('totalClients').textContent=bookings.length;
 document.getElementById('pending').textContent=bookings.filter(b=>b.status=='Pending').length;
 document.getElementById('active').textContent=bookings.filter(b=>b.status=='Active').length;

 // Country stats
 let map={}; caregivers.forEach(c=>{map[c.country]=(map[c.country]||0)+1});
 document.getElementById('countryStats').innerHTML=Object.entries(map).map(([k,v])=>`<div class="item"><b>🌍 ${k}</b><span style="background:#e0e7ff;padding:4px 10px;border-radius:12px">${v} caregivers</span></div>`).join('')||'<small style=color:#94a3b8>No data</small>';

 // Bookings
 document.getElementById('bookingsList').innerHTML=bookings.slice(0,20).map((b,i)=>`<div class="item"><div><b>${b.client||b.name||'Client'}</b> <small>→ ${b.caregiver}</small><br><small>${b.country||''} ${b.clientLocation||''} • ${b.date||''} • ${b.status||'Pending'}</small></div><div><span style="background:#dcfce7;padding:4px 8px;border-radius:8px;font-size:11px">${b.status||'Pending'}</span> <button class="btn" style="background:#ef4444;color:#fff" onclick="delBooking(${i})">X</button></div></div>`).join('')||'<small style=color:#94a3b8>No bookings yet - book from homepage!</small>';

 // Caregivers
 document.getElementById('caregiversList').innerHTML=caregivers.map((c,i)=>`<div class="item"><div><b>${c.name}</b> <small>🌍 ${c.country}</small><br><small>${c.service} • ${c.location} • ${c.phone}</small></div><button class="btn" style="background:#ef4444;color:#fff" onclick="delCaregiver(${i})">Delete</button></div>`).join('');
}
function delBooking(i){if(confirm('Delete booking?')){bookings.splice(i,1); localStorage.setItem('bookings',JSON.stringify(bookings)); render();}}
function delCaregiver(i){if(confirm('Delete caregiver?')){caregivers.splice(i,1); localStorage.setItem('caregivers',JSON.stringify(caregivers)); render();}}
function clearBookings(){if(confirm('Clear ALL bookings?')){bookings=[]; localStorage.setItem('bookings',JSON.stringify(bookings)); render();}}
function clearCaregivers(){if(confirm('Reset to 3 global samples?')){localStorage.removeItem('caregivers'); caregivers=[{name:'Sample Caregiver - Sarah',service:'Elderly Care',phone:'+256772101875',location:'Kampala',country:'Uganda'},{name:'Emily Johnson',service:'Child Care',phone:'+1 212 555 0100',location:'New York',country:'USA'},{name:'Grace Atim',service:'Nursing',phone:'+44 20 7123 4567',location:'London',country:'UK'}]; localStorage.setItem('caregivers',JSON.stringify(caregivers)); render();}}
render();
try{
 fetch(API+'/caregivers').then(r=>r.json()).then(d=>{if(d&&d.length){caregivers=d; localStorage.setItem('caregivers',JSON.stringify(d)); render();}});
 fetch(API+'/bookings').then(r=>r.json()).then(d=>{if(d&&d.length){bookings=d; localStorage.setItem('bookings',JSON.stringify(d)); render();}});
}catch{}
</script>
</body></html>
