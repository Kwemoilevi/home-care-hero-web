<!DOCTYPE html><html><head><title>Dashboard - Home Care Hero</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;padding:16px;background:#f5f7fb}h2{margin-top:30px}.card{background:#fff;padding:16px;border-radius:10px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}.badge{padding:4px 8px;background:#0d6efd;color:#fff;border-radius:5px;font-size:12px}</style></head><body><h1>📊 Home Care Hero Dashboard</h1><p>Admin: 0772101875</p><button onclick="load()">🔄 Refresh Data</button><h2>🧑‍⚕️ Caregivers (<span id="cCount">0</span>)</h2><div id="caregivers"></div><h2>📅 Client Bookings (<span id="bCount">0</span>)</h2><div id="bookings"></div><script>const API="https://home-Care-hero-api.onrender.com";async function load(){const cDiv=document.getElementById('caregivers');const bDiv=document.getElementById('bookings');cDiv.innerHTML='Loading...';try{const r1=await fetch(API+'/api/caregivers');const d1=await r1.json();document.getElementById('cCount').textContent=d1.count||0;cDiv.innerHTML=d1.caregivers.map(c=>`<div class=card><b>${c.name}</b> <span class=badge>${c.skill}</span><br>📞 ${c.phone}<br>📍 ${c.location}<br>Exp: ${c.experience} yrs<br><small>${c.bio||''}</small><br><small>ID: ${c.id}</small></div>`).join('')||'No caregivers yet';}catch(e){cDiv.innerHTML='Error: '+e.message}try{const r2=await fetch(API+'/api/booking');const d2=await r2.json();}catch{/*bookings endpoint not GET, use memory*/}try{const r=await fetch(API+'/');const d=await r.json();document.getElementById('bCount').textContent=d.bookings;}catch{}}load();</script></body></html>
