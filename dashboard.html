<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f1f5f9;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;background:#1e293b;color:#fff;padding:12px;border-radius:12px}.card{background:#fff;padding:14px;border-radius:12px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer}</style></head><body><div class="top"><b>📊 Admin Dashboard</b><div><a href="index.html" style="color:#fff;background:#2563eb;padding:7px 10px;border-radius:8px;text-decoration:none">🏠 Home</a> <a href="tracker.html" style="color:#fff;background:#22c55e;padding:7px 10px;border-radius:8px;text-decoration:none">📍 Track</a></div></div><div id="list"></div><script>let caregivers=JSON.parse(localStorage.getItem('caregivers')||'[]');let bookings=JSON.parse(localStorage.getItem('bookings')||'[]');function render(){let h='';if(caregivers.length==0)h='<div class=card>No caregivers yet. <a href=register.html>Register one</a></div>';caregivers.forEach((c,i)=>{h+=`<div class=card><b>${c.name}</b> - ${c.service||'Care'} (${c.country||''})<br>📞 ${c.phone||''} | ${c.location||''}<br><div style=margin-top:8px;display:flex;gap:6px><button class=btn style=background:#22c55e;color:#fff onclick="book(${i})">Book</button><button class=btn style=background:#ef4444;color:#fff onclick="del(${i})">Delete</button></div></div>`});if(bookings.length>0){h+='<div class=card><b>📅 Bookings:</b><br>'+bookings.map(b=>`${b.name} booked on ${b.date}`).join('<br>')+'</div>'}document.getElementById('list').innerHTML=h}function book(i){let c=caregivers[i];let b={name:c.name,date:new Date().toLocaleDateString()};bookings.unshift(b);localStorage.setItem('bookings',JSON.stringify(bookings));render()}function del(i){if(confirm('Delete?')){caregivers.splice(i,1);localStorage.setItem('caregivers',JSON.stringify(caregivers));render()}}render();</script></body></html>
