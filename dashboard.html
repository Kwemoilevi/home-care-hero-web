<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;padding:16px;background:#f5f7fb;max-width:700px;margin:auto}
.card{background:#fff;padding:16px;border-radius:12px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.btn{padding:8px 12px;border:none;border-radius:6px;margin:4px;cursor:pointer;text-decoration:none;display:inline-block;color:#fff}
.wa{background:#25D366}.verify{background:#0d6efd}.del{background:#dc3545}
</style>
</head>
<body>
<div id="login" class="card" style="max-width:400px;margin:80px auto;text-align:center">
<h2>🔒 Admin Login</h2>
<input id="pwd" type="password" placeholder="Password" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px">
<button onclick="login()" style="width:100%;padding:12px;margin-top:10px;background:#0d6efd;color:#fff;border:none;border-radius:8px">Login</button>
<p id="msg"></p>
<small>Pass: 0772101875</small>
</div>
<div id="dash" style="display:none">
<h1>📊 Dashboard</h1>
<button onclick="loadData()">Refresh</button> <button onclick="logout()">Logout</button>
<div id="caregivers"></div>
</div>
<script>
const API="https://home-care-hero-api.onrender.com";
const PASS="0772101875";
function login(){if(document.getElementById('pwd').value===PASS){localStorage.setItem('a','yes');show()}else{document.getElementById('msg').textContent='Wrong pass'}}
function show(){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';loadData()}
function logout(){localStorage.removeItem('a');location.reload()}
if(localStorage.getItem('a')==='yes')show();
async function loadData(){const d=document.getElementById('caregivers');d.innerHTML='Loading...';try{const r=await fetch(API+'/api/caregivers');const j=await r.json();d.innerHTML=j.caregivers.map(c=>{let p=c.phone.replace(/[^0-9]/g,'');if(p.startsWith('0'))p='256'+p.slice(1);return `<div class=card><b>${c.name}</b> ${c.verified?'✅':''}<br>${c.phone}<br>${c.location} ${c.skill}<br><a class=btn wa href=https://wa.me/${p} target=_blank>WhatsApp</a> <a class=btn style=background:#000 href=tel:${c.phone}>Call</a> ${!c.verified?`<button class=btn verify onclick=verifyCaregiver('${c.id}')>Verify</button>`:''} <button class=btn del onclick=deleteCaregiver('${c.id}')>Delete</button></div>`}).join('')||'No caregivers'}catch(e){d.innerHTML='Error: '+e.message+' - Wait 30sec API sleeping'}}
async function verifyCaregiver(id){await fetch(API+'/api/caregivers/'+id+'/verify',{method:'POST'});loadData()}
async function deleteCaregiver(id){if(confirm('Delete?')){await fetch(API+'/api/caregivers/'+id,{method:'DELETE'});loadData()}}
</script>
</body>
</html>
