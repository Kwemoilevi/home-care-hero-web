<!-- BETPAWA STYLE CREDIT CHECK -->
<div style="background:#1e293b;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #22c55e">
<div><small style="color:#94a3b8">💰 WALLET BALANCE</small><br><b id="balance" style="font-size:20px">UGX 0</b> <span id="eye" onclick="toggleBal()" style="cursor:pointer;margin-left:8px">👁️</span></div>
<div><button onclick="addCredit()" style="background:#22c55e;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:800">+ Deposit</button></div>
</div>
<div style="background:#0f172a;padding:8px 16px;display:flex;gap:8px;overflow-x:auto">
<button style="background:#334155;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px">📊 Today: UGX 0</button>
<button style="background:#334155;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px">💸 Earned: UGX 0</button>
<button style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px">🏧 Withdraw</button>
</div>
<script>
let bal=parseInt(localStorage.getItem('walletBal')||'25000');
let hidden=false;
function showBal(){document.getElementById('balance').textContent=hidden?'UGX •••••':'UGX '+bal.toLocaleString();}
function toggleBal(){hidden=!hidden;document.getElementById('eye').textContent=hidden?'🙈':'👁️';showBal();}
function addCredit(){let a=prompt('Enter amount to add (UGX):','5000');if(a){bal+=parseInt(a);localStorage.setItem('walletBal',bal);showBal();alert('✅ Added! New Balance: UGX '+bal.toLocaleString());}}
showBal();
</script>
<!-- END CREDIT CHECK -->
